A CONTEMPLACIÓN", "bold": true}, {"text": "NO MIRO YO TAN HONDO", "bold": true}, {"text": "COMO ME MIRAS VOS", "bold": true}, {"text": "EN MI SOLEDAD, YO Y TU MIRADA", "bold": true}, {"text": "QUE TRASPASA QUE ME ACABA", "bold": true}, {"text": "SACUDIENDO EL CORAZÓN", "bold": true}]}, {"number": "075", "title": "Tu Reino entre los vivos", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "No permitas Jesús que muera", "bold": false}, {"text": "Sin antes ver tu reino entre los vivos", "bold": false}, {"text": "Que no me vaya si alguien no te conociera", "bold": false}, {"text": "Que me quede hasta que el mundo te haya oído", "bold": false}, {"text": "", "bold": false}, {"text": "MAESTRO QUE BIEN ESTAMOS ACÁ", "bold": true}, {"text": "AY SI TODOS PUDIERAN SENTIR TU PAZ", "bold": true}, {"text": "DEJARME QUEDARME Y SER YO,", "bold": true}, {"text": "DEJAME QUEDARME Y LLEVAR TU AMOR", "bold": true}, {"text": "", "bold": false}, {"text": "Que al final de mis días pueda decir,", "bold": false}, {"text": "que he peleado el buen combate hasta el fin", "bold": false}, {"text": "Completé mi carrera, conservé mi fe,", "bold": false}, {"text": "la corona de justicia está preparada para mi", "bold": false}]}, {"number": "076", "title": "Unción", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Hay una unción aquí", "bold": false}, {"text": "Cayendo sobre mí", "bold": false}, {"text": "Muándome, cambiando mi ser.", "bold": false}, {"text": "", "bold": false}, {"text": "Mi espíritu y mi alma se están llenando con", "bold": false}, {"text": "El poder/amor del Espíritu Santo", "bold": false}, {"text": "Mi vida nunca más será igual", "bold": false}]}, {"number": "077", "title": "Ven y sígueme", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Ven y sígueme, y mar adentro echa ya tus redes", "bold": false}, {"text": "Ven y yo te haré, pescador de hombres.", "bold": false}, {"text": "", "bold": false}, {"text": "EN TUS PALABRAS ECHARÉ MIS REDES", "bold": true}, {"text": "DEJO MI BARCA Y DONDE QUIERAS IRÉ", "bold": true}, {"text": "TU ME LLAMASTE SEÑOR POR MI NOMBRE", "bold": true}, {"text": "Y SOLO A TI SEÑOR, TE SEGUIRÉ", "bold": true}, {"text": "", "bold": false}, {"text": "Te vi trabajar, esa noche en que fracasaste.", "bold": false}, {"text": "Se de tu dolor, de tu vergüenza", "bold": false}, {"text": "de tus fragilidades.", "bold": false}, {"text": "", "bold": false}, {"text": "HOY YO TE PIDO QUE CONFÍES DE NUEVO.", "bold": true}, {"text": "VUELVE A TIRAR CON", "bold": true}, {"text": "LA ESPERANZA DE AYER.", "bold": true}, {"text": "ESTOY CONTIGO", "bold": true}, {"text": "Y TE PROMETO ABUNDANCIA,", "bold": true}, {"text": "DEJA TODO POR MI AMOR, VEN Y SÍGUEME.", "bold": true}]}, {"number": "078", "title": "Jesús estoy aquí", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Jesús, estoy aquí,", "bold": false}, {"text": "Jesús, que esperas de mi.", "bold": false}, {"text": "Mis manos están vacías,", "bold": false}, {"text": "Que puedo ofrecerte", "bold": false}, {"text": "Solo se que quiero ser diferente.", "bold": false}, {"text": "", "bold": false}, {"text": "Jesús, estoy aquí,", "bold": false}, {"text": "Jesús, que esperas de mi.", "bold": false}, {"text": "Mis ojos temen al mirarte,", "bold": false}, {"text": "Quisiera poder enfrentarte.", "bold": false}, {"text": "", "bold": false}, {"text": "AMAR COMO TU AMAS,", "bold": true}, {"text": "SENTIR COMO TU SIENTES,", "bold": true}, {"text": "MIRAR A TRAVÉS DE TUS OJOS, JESÚS.", "bold": true}, {"text": "", "bold": false}, {"text": "Contigo, mi camino es difícil,", "bold": false}, {"text": "Me exiges abrir un nuevo horizonte", "bold": false}, {"text": "En la soledad de mi noche, Jesús.", "bold": false}, {"text": "", "bold": false}, {"text": "No, no puedo abandonarte,", "bold": false}, {"text": "Jesús, en mi penetraste,", "bold": false}, {"text": "Me habitaste, triunfaste", "bold": false}, {"text": "Y hoy vives en mí.", "bold": false}, {"text": "SALIDA SALIDA", "bold": true}]}, {"number": "079", "title": "Ángeles de Dios", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Si sentís un murmullo muy cerca de ti", "bold": false}, {"text": "Es un ángel llegando para recibir", "bold": false}, {"text": "Todas tus oraciones y llevarlas al cielo", "bold": false}, {"text": "Así, abre el corazón y comienza a alabar", "bold": false}, {"text": "El gozo del cielo todo sobre el altar", "bold": false}, {"text": "Hay un ángel llegando y bendición en sus manos", "bold": false}, {"text": "", "bold": false}, {"text": "HAY, ÁNGELES VOLANDO EN ESTE LUGAR", "bold": true}, {"text": "EN MEDIO DEL PUEBLO Y JUNTO AL ALTAR", "bold": true}, {"text": "SUBIENDO Y BAJANDO", "bold": true}, {"text": "EN TODAS LAS DIRECCIONES", "bold": true}, {"text": "NO SÉ SI LA IGLESIA SUBIÓ", "bold": true}, {"text": "O SI DEL CIELO BAJÓ", "bold": true}, {"text": "SI SE QUE ESTA LLENO DE ÁNGELES DE DIOS", "bold": true}, {"text": "PORQUE EL MISMO DIOS ESTÁ AQUÍ", "bold": true}, {"text": "", "bold": false}, {"text": "Cuando los ángeles pasan la iglesia se alegra", "bold": false}, {"text": "Ella canta, ella llora, ríe y congrega", "bold": false}, {"text": "Enfrenta el infierno y disipa el mal", "bold": false}, {"text": "", "bold": false}, {"text": "Siente la brisa del vuelo de tu ángel ahora", "bold": false}, {"text": "Comienza hermano pues esta es tu hora", "bold": false}, {"text": "La bendición llegó y te la vas a llevar.", "bold": false}]}, {"number": "080", "title": "Chamarrita de la Virgen", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Dulce muchacha humilde de Palestina", "bold": false}, {"text": "a vos pa' ser su madre, Dios te eligió", "bold": false}, {"text": "y cuando desde el cielo te mandó un ángel", "bold": false}, {"text": "para pedir tu consentimiento", "bold": false}, {"text": "vos le dijiste: \"Tu esclava soy\". (bis)", "bold": false}, {"text": "", "bold": false}, {"text": "POR ESO VOY A DARTE MI CORAZÓN", "bold": true}, {"text": "Y CANTANDO REPETIRE TU NOMBRE,", "bold": true}, {"text": "MARÍA DE NAZARET. (bis)", "bold": false}, {"text": "", "bold": false}, {"text": "Fue tu materna espera luz y esperanza", "bold": false}, {"text": "hasta que el gurisito nació en Belén.", "bold": false}, {"text": "Y vinieron los pobres y peregrinos", "bold": false}, {"text": "para adorarlo, y él sonreía", "bold": false}, {"text": "Dios con nosotros, el Emmanuel.", "bold": false}]}, {"number": "081", "title": "Dulce Doncella", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Estamos vivos y vivimos,", "bold": false}, {"text": "amar es nuestro destino,", "bold": false}, {"text": "aunque este viaje es distinto,", "bold": false}, {"text": "sólo hay un solo camino,", "bold": false}, {"text": "llegar a vos.", "bold": false}, {"text": "", "bold": false}, {"text": "DULCE DONCELLA, TE SEGUIRÉ,", "bold": true}, {"text": "TÚ ERES MI ESTRELLA,", "bold": true}, {"text": "TE ALCANZARÉ, YO SÉ QUE SÍ.", "bold": true}, {"text": "", "bold": false}, {"text": "Sólo quedó hierba seca", "bold": false}, {"text": "por dónde antes pisamos,", "bold": false}, {"text": "hoy hay flores de pureza", "bold": false}, {"text": "En la ruta de mis días el viaje fue muy pesado", "bold": false}, {"text": "hasta que ví una doncella y así juntos", "bold": false}, {"text": "caminamos, para llegar.", "bold": false}]}, {"number": "082", "title": "El Dios de la Vida", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Somos un nuevo pueblo,", "bold": false}, {"text": "gestando un mundo distinto,", "bold": false}, {"text": "Los que en el amor creemos,", "bold": false}, {"text": "los que en el amor vivimos.", "bold": false}, {"text": "", "bold": false}, {"text": "Llevamos este tesoro,", "bold": false}, {"text": "en vasijas de barro", "bold": false}, {"text": "Es un mensaje del Cielo", "bold": false}, {"text": "y nadie podrá callarlo.", "bold": false}, {"text": "", "bold": false}, {"text": "Y proclamamos un nuevo día", "bold": false}, {"text": "Porque la mu false}, {"text": "esperamos contra toda esperanza", "bold": false}]}, {"number": "084", "title": "Joven levántate", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Joven levántate,", "bold": false}, {"text": "abraza tu cruz, sígueme.", "bold": false}, {"text": "Despierta y anímate", "bold": false}, {"text": "a entrar en el misterio de la fe.", "bold": false}, {"text": "", "bold": false}, {"text": "QUE TU VIDA SEA LUZ,", "bold": true}, {"text": "QUE TUS PASOS ESPERANZA,", "bold": true}, {"text": "EL AMOR, SI SE COMPARTE, PARA", "bold": true}, {"text": "TODOS ALCANZA.", "bold": true}, {"text": "", "bold": false}, {"text": "Y SI SIN FE TE PIERDES DEL CAMINO,", "bold": true}, {"text": "NO HAY TIEMPO DE TENER MIEDO", "bold": true}, {"text": "ESE NO ES TU DESTINO.", "bold": true}, {"text": "ACOMPAÑA AL POBRE,", "bold": true}, {"text": "AL QUE BUSCA UN AMIGO", "bold": true}, {"text": "Y ESTARÁS CAMINANDO CONMIGO.", "bold": true}, {"text": "", "bold": false}, {"text": "Joven levántate,", "bold": false}, {"text": "aprende a amar lo que no ves.", "bold": false}, {"text": "Despierta y anímate", "bold": false}, {"text": "hay muchos esperando tu sencillez", "bold": false}]}, {"number": "085", "title": "Madre", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Junto a Ti María como un niño quiero estar,", "bold": false}, {"text": "Tómame en tus brazos guíame en mi caminar.", "bold": false}, {"text": "Quiero que me eduques", "bold": false}, {"text": "que me enseñes a rezar,", "bold": false}, {"text": "Hazme transparente lléname de paz.", "bold": false}, {"text": "", "bold": false}, {"text": "MADRE, MADRE, MADRE, MADRE", "bold": true}, {"text": "MADRE, MADRE, MADRE, MADRE.", "bold": true}, {"text": "", "bold": false}, {"text": "Gracias Madre mía, por mostrarnos a Jesús,", "bold": false}, {"text": "Haznos mas humildes tan sencillos como Tu,", "bold": false}, {"text": "Gracias Madre mía, por abrir Tu corazón,", "bold": false}, {"text": "Porque nos congregas y nos das Tu n mundo nuevo.", "bold": false}, {"text": "Donde el hombre tenga que luchar", "bold": false}, {"text": "para que Cristo pueda reinar junto a su Padre.", "bold": false}, {"text": "", "bold": false}, {"text": "SER RESPUESTA PARA EL MUNDO", "bold": true}, {"text": "ES LA MISIÓN", "bold": true}, {"text": "Y YO, MADRE, ME CONSAGRO A VOS,", "bold": true}, {"text": "POR ENTERO.", "bold": true}, {"text": "SOS LA REINA DE MI CORAZÓN.", "bold": true}, {"text": "MADRE HUMILDE, ESCLAVA DEL SEÑOR,", "bold": true}, {"text": "HAZME FUERTE EN LA ALIANZA", "bold": true}, {"text": "DE AMOR ENTERO.", "bold": true}]}, {"number": "088", "title": "Mar adentro", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Es hora de partir mar adentro y no voy a esperar.", "bold": false}, {"text": "Él vendrá para ir mar adentro y lo voy a esperar.", "bold": false}, {"text": "Él ya está junto a mi y sus ojos derraman ternura.", "bold": false}, {"text": "Él espera mi si y yo no quiero hacerlo esperar.", "bold": false}, {"text": "", "bold": false}, {"text": "QUIERO SENTIR TU AMOR", "bold": true}, {"text": "Y VOLVER A NACER.", "bold": true}, {"text": "QUIERO DECIRTE VEN, MI BARCA ES TUYA.", "bold": true}, {"text": "ES TAN INMENSO EL MAR", "bold": true}, {"text": "PERO YO VOY CON VOS,", "bold": true}, {"text": "NO TEMO NAVEGAR SI ESTÁ MI DIOS", "bold": true}, {"text": "", "bold": false}, {"text": "Quiero ser como vos", "bold": false}, {"text": "y ser pan que se deja comer.", "bold": false}, {"text": "Quiero que los demás vean", "bold": false}, {"text": "en mi tu sonrisa Señor.", "bold": false}, {"text": "Quiero ser manantial que da vida", "bold": false}, {"text": "donde quiera que vaya.", "bold": false}, {"text": "Quiero llevar tu luz a ese mundo", "bold": false}, {"text": "que no habla de Dios.", "bold": false}]}, {"number": "089", "title": "María de la Alianza", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Que silencio más delicado,", "bold": false}, {"text": "amor del amor más escondido", "bold": false}, {"text": "Eres mujer puerta del cielo,", "bold": false}, {"text": "tres colores adornan tu manto", "bold": false}, {"text": "Bajan las cascadas de los árboles", "bold": false}, {"text": "Que caen hasta el suelo y llegan al santuario", "bold": false}, {"text": "", "bold": false}, {"text": "ME QUERES DAR LA MANO,", "bold": true}, {"text": "Y YO PEDIR LA TUYA", "bold": true}, {"text": "NO PUEDO ESTAR SIN TI,", "bold": true}, {"text": "SIN TU MIRADA PURA", "bold": true}, {"text": "TU VOZ ME LLENA EL ALMA,", "bold": true}, {"text": "MARÍA DE LA ALIANZA", "bold": true}, {"text": "PALABRA HECHA FLOR (bis)", "bold": false}, {"text": "", "bold": false}, {"text": "He cambiado todo mi canto,", "bold": false}, {"text": "tan solo para soñar tu risa", "bold": false}, {"text": "Y no soy más que polvo en el camino,", "bold": false}, {"text": "Aunque no es polvo de tu olvido", "bold": false}, {"text": "Quiero ser un puente hacia el cielo,", "bold": false}, {"text": "Hecho de barro y fuego,", "bold": false}, {"text": "que nace en el santuario.", "bold": false}]}, {"number": "090", "title": "Moveremos las montañas", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Se ha puesto el sol y en la noche caminamos,", "bold": false}, {"text": "Venimos del dolor pero sonreímos.", "bold": false}, {"text": "Somos la semilla del día que comienza", "bold": false}, {"text": "Y forjamos, con Dios, nuestro destino.", "bold": false}, {"text": "", "bold": false}, {"text": "Volveremos a nacer de las cenizas,", "bold": false}, {"text": "Plantaremos la flor donde no hay nada,", "bold": false}, {"text": "Hablaremos de amor donde haya odio y,", "bold": false}, {"text": "algún día,", "bold": false}, {"text": "Algún día, moveremos las montañas.", "bold": false}, {"text": "", "bold": false}, {"text": "Porque somos partidarios de la vida", "bold": false}, {"text": "Y llevamos en el pecho la esperanza,", "bold": false}, {"text": "Porque somos caminantes en la noche", "bold": false}, { function render(){
 const q=norm(filter.value.trim());
 const results=songs.filter(s=>norm(s.number+' '+s.title).includes(q));
 document.getElementById('count').textContent=results.length+' de 95 canciones';
 list.replaceChildren();
 for(const s of results){
  const b=document.createElement('button');b.className='item';b.type='button';
  const n=document.createElement('span');n.className='num';n.textContent=s.number;
  const t=document.createElement('span');t.className='name';t.textContent=s.title;
  const a=document.createElement('span');a.className='arrow';a.textContent='›';
  b.append(n,t,a);b.onclick=()=>{location.hash='cancion-'+s.number};
  list.append(b);
 }
 if(!results.length){const e=document.createElement('p');e.className='empty';e.textContent='No se encontraron canciones.';list.append(e)}
}
function route(){
 const id=(location.hash.match(/^#cancion-(\d{3})$/)||[])[1];
 const s=songs.find(x=>x.number===id);
 document.getElementById('index').style.display=s?'none':'block';
 document.getElementById('song').classList.toggle('active',!!s);
 if(s){
  document.getElementById('songTitle').textContent=s.title;
  document.getElementById('songNum').textContent='Canción '+s.number;
  const el=document.getElementById('lyrics');el.replaceChildren();
  for(const line of s.lines){
   const p=document.createElement('p');p.textContent=line.text||' ';
   if(!line.text)p.className='blank';
   else if(line.bold)p.className='chorus';
   el.append(p);
  }
 }
 window.scrollTo(0,0);
}
function goBack(){location.hash='indice'}
filter.addEventListener('input',render);
window.addEventListener('hashchange',route);
render();route();
</script></body></html>
