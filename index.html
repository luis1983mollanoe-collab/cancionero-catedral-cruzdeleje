.hero-content{position:relative;margin:-75px auto 0;padding:0 18px;max-width:720px}
.virgen{display:block;width:150px;height:200px;object-fit:cover;object-position:center 12%;border:5px solid #fffaf1;border-radius:85px 85px 18px 18px;box-shadow:0 7px 24px #352f2b40;margin:0 auto 18px}
.ornament{width:90px;height:1px;background:var(--gold);margin:18px auto 0}
@media(min-width:600px){.virgen{width:170px;height:220px}.hero-content{margin-top:-95px}}
header .cross{font-size:38px;color:var(--gold)}h1{font-family:Georgia,serif;font-weight:500;font-size:clamp(31px,7vw,47px);margin:10px 0}header p{margin:6px auto;max-width:420px;color:var(--soft);line-height:1.5}
main{max-width:780px;margin:auto;padding:0 16px 80px}.search{position:sticky;top:0;background:var(--bg);padding:12px 0 8px;z-index:5}
input{width:100%;font-size:18px;border:1px solid #d6c8b4;border-radius:12px;padding:16px;background:white;color:var(--ink)}
input:focus{outline:2px solid var(--gold);outline-offset:1px}
.count{font-size:13px;color:var(--soft);margin:10px 4px}
.list{display:grid;gap:8px}.item{width:100%;text-align:left;display:flex;align-items:center;gap:13px;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);font-size:17px;cursor:pointer}
.num{font-weight:750;color:var(--gold);min-width:39px}.name{flex:1}.arrow{color:var(--gold);font-size:22px}
.item:active{background:#f1e9da}.song{display:none}.song.active{display:block}
.song-head{padding:23px 0 16px;border-bottom:1px solid var(--line)}.song h2{font-family:Georgia,serif;font-size:clamp(27px,6vw,38px);font-weight:500;line-height:1.2;margin:12px 0}.song .number{color:var(--gold);font-weight:750}
.verse{padding:24px 2px 60px;font-size:clamp(19px,4.7vw,23px);line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}
.verse p{margin:0 0 4px}.verse p.blank{height:22px;margin:0}.verse p.chorus{font-weight:750}
.back{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:white;border:0;border-radius:10px;padding:13px 16px;font-size:16px;cursor:pointer}
.footer{text-align:center;color:var(--soft);font-size:13px;margin-top:40px}
.empty{padding:20px;color:var(--soft);text-align:center}
</style>

const songs=[{"number": "001", "title": "Abre los ojos de mi alma", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Abre los ojos de mi alma", "bold": false}, {"text": "Abre mis ojos, oh, Dios", "bold": false}, {"text": "Yo quiero verte, yo quiero verte.", "bold": false}, {"text": "", "bold": false}, {"text": "VERTE ALTO EN MAJESTAD", "bold": true}, {"text": "BRILLAS EN LA LUZ DE TU GLORIA", "bold": true}, {"text": "NOS BRINDAS TU GRACIA, OH, DIOS", "bold": true}, {"text": "Y CANTO SANTO, SANTO, SANTO", "bold": true}, {"text": "SANTO, SANTO, SANTO", "bold": true}, {"text": "YO QUIERO VERTE.", "bold": true}]}, {"number": "002", "title": "Abre tus brazos", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Si algún día el odio y las guerras", "bold": false}, {"text": "ya no surcan más la tierra,", "bold": false}, {"text": "será el Reino del Amor.", "bold": false}, {"text": "Todos unidos con las manos estrechadas,", "bold": false}, {"text": "alzaremos la mirada", "bold": false}, {"text": "para encontrar al Señor.", "bold": false}, {"text": "", "bold": false}, {"text": "ABRE TUS BRAZOS, SEÑOR, SEÑOR.", "bold": true}, {"text": "VEN A MI LADO, MI DIOS, MI DIOS.", "bold": true}, {"text": "", "bold": false}, {"text": "Si los cañones, las granadas y las balas,", "bold": false}, {"text": "se cambiarán por palabras y por rezos al Señor.", "bold": false}, {"text": "Si la envidia, el odio y la codicia,", "bold": false}, {"text": "nuestro suelo ya no pisan", "bold": false}, {"text": "podremos vivir mejor.", "bold": false}]}, {"number": "003", "title": "Cristo Joven", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Ven hermano y cántale a Cristo,", "bold": false}, {"text": "A ese Cristo joven que un día nos redimió,", "bold": false}, {"text": "Haz de tu amor una plegaria,", "bold": false}, {"text": "Un simple canto alegre que el Señor escuchara.", "bold": false}, {"text": "", "bold": false}, {"text": "VEN AQUÍ, CANTA YA.", "bold": true}, {"text": "NO TE OLVIDES TU DE CRISTO", "bold": true}, {"text": "PIENSA QUE, EN LA CRUZ,", "bold": true}, {"text": "POR NOSOTROS EL SE DIO", "bold": true}]}, {"number": "004", "title": "Despertemos llega Cristo", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Despertemos llega Cristo, ven Señor.", "bold": false}, {"text": "Acudamos a su encuentro, ven Señor.", "bold": false}, {"text": "", "bold": false}, {"text": "La Iglesia espera tu venida, ven Señor,", "bold": false}, {"text": "y llena de alegría canta ven Señor.", "bold": false}, {"text": "", "bold": false}, {"text": "Palabra eterna y creadora, ven Señor,", "bold": false}, {"text": "QUE VENGANONERO       DESPUÉS. GRACIAS.", "bold": true}, {"text": "", "bold": false}, {"text": "Imagen de luz eterna, ven Señor,", "bold": false}, {"text": "a iluminar nuestras tinieblas, ven Señor.", "bold": false}]}, {"number": "005", "title": "En el nombre de Dios", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Aquí estamos Señor, en tu casa otra vez", "bold": false}, {"text": "¡Qué alegría volverte a encontrar!", "bold": false}, {"text": "Vamos a compartir y expresar nuestra fe", "bold": false}, {"text": "como hermanos en torno al altar.", "bold": false}, {"text": "", "bold": false}, {"text": "EN EL NOMBRE DE DIOS VAMOS A CELEBRAR", "bold": true}, {"text": "EL MISTERIO DE LA SALVACIÓN.", "bold": true}, {"text": "EL SEÑOR NOS DARÁ SU PALABRA Y SU PAN,", "bold": true}, {"text": "ES LA FIESTA DEL PUEBLO DE DIOS", "bold": true}]}, {"number": "006", "title": "En siete días", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "En siete días creó Dios al mundo.", "bold": false}, {"text": "Adán pecó y perdió el cielo.", "bold": false}, {"text": "Jesús vino para redimirnos,", "bold": false}, {"text": "murió en la cruz y nos salvó.", "bold": false}, {"text": "", "bold": false}, {"text": "DEN AL SEÑOR", "bold": true}, {"text": "(DEN AL SEÑOR SUS ALABANZAS)", "bold": true}, {"text": "DENLE PODER", "bold": true}, {"text": "(DENLE PODER, HONOR Y GLORIA)", "bold": true}, {"text": "A UNA VOZ, CANTEN UN HIMNO AL SEÑOR", "bold": true}, {"text": "", "bold": false}, {"text": "Salidos ya de Egipto y el mar pasado,", "bold": false}, {"text": "Saltaron y bailaron, se llenaron de júbilo.", "bold": false}]}, {"number": "007", "title": "Iglesia peregrina", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Todos unidos formando un solo cuerpo,", "bold": false}, {"text": "un Pueblo que en la Pascua nació;", "bold": false}, {"text": "miembros de Cristo en sangre redimidos,", "bold": false}, {"text": "Iglesia Peregrina de Dios.", "bold": false}, {"text": "", "bold": false}, {"text": "Vive en nosotros la fuerza del Espíritu", "bold": false}, {"text": "que el Hijo desde el Padre envió,", "bold": false}, {"text": "él nos conduce, nos guía y alimenta,", "bold": false}, {"text": "Iglesia peregrina de Dios.", "bold": false}, {"text": "", "bold": false}, {"text": "SOMOS EN LA TIERRA", "bold": true}, {"text": "SEMILLA DE OTRO REINO,", "bold": true}, {"text": "SOMOS TESTIMONIO DE AMOR.", "bold": true}, {"text": "PAZ PARA LAS GUERRAS", "bold": true}, {"text": "Y LUZ ENTRE LAS SOMBRAS", "bold": true}, {"text": "IGLESIA PEREGRINA DE DIOS.", "bold": true}]}, {"number": "008", "title": "Llegamos a Ti", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Después de una semana de mucho trabajo", "bold": false}, {"text": "querer decirte mil cosas y no poder.", "bold": false}, {"text": "Tan sólo ofrecerte cansancio, quizás un fracaso", "bold": false}, {"text": "y siempre la misma alegría volver a tener.", "bold": false}, {"text": "", "bold": false}, {"text": "A TI, LLEGAMOS A TI,", "bold": true}, {"text": "QUEREMOS AMARTE SEÑOR", "bold": true}, {"text": "DONARTE TODO NUESTRO AMOR,", "bold": true}, {"text": "DECIRTE SIEMPRE QUE SÍ.", "bold": true}]}, {"number": "009", "title": "Qué lindo llegar cantando", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "QUE LINDO LLEGAR CANTANDO", "bold": true}, {"text": "A TU CASA PADRE DIOS,", "bold": true}, {"text": "Y HERMANADOS EN EL CANTO", "bold": true}, {"text": "COMENZAR NUESTRA ORACIÓN.", "bold": true}, {"text": "DARTE GRACIAS Y ALABANZAS,", "bold": true}, {"text": "PEDIRTE AYUDA Y PERDÓN.", "bold": true}, {"text": "QUE LINDO LLEGAR CANTANDO", "bold": true}, {"text": "A TU CASA PADRE DIOS.", "bold": true}, {"text": "", "bold": false}, {"text": "Que lindo traer la vida y en nuestra celebración,", "bold": false}, {"text": "contarla a nuestros hermanos y que se", "bold": false}, {"text": "vuelva oración,", "bold": false}, {"text": "sudor, lágrima, esperanza, trabajo, rezo y", "bold": false}, {"text": "amor.", "bold": false}, {"text": "Que lindo rezar cantando la vida que se nos dió.", "bold": false}]}, {"number": "010", "title": "Tengo un ideal", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "No, ya no puedo ser como fui hasta ayer", "bold": false}, {"text": "Hoy debo cambiar.", "bold": false}, {"text": "Ya puedo comenzar, pues para vivir", "bold": false}, {"text": "Tengo un ideal.", "bold": false}, {"text": "", "bold": false}, {"text": "AMAR AMAR, MORIR POR LOS DEMAS", "bold": true}, {"text": "Y ASI VIVIR Y NO VOLVER ATRÁS", "bold": true}, {"text": "AMAR AMAR, MORIR POR LOS DEMAS", "bold": true}, {"text": "Y ASI VIVIR Y NO VOLVER ATRÁS", "bold": true}, {"text": "", "bold": false}, {"text": "Hoy ya comprendo al fin que debo morir", "bold": false}, {"text": "Si quiero nacer.", "bold": false}, {"text": "Pues es muriendo que al fin entraré", "bold": false}, {"text": "A la eternidad.", "bold": false}]}, {"number": "011", "title": "Venga Tu Reino", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Somos Pueblo de Dios, Iglesia Peregrina.", "bold": false}, {"text": "Como una gran familia que camina unida", "bold": false}, {"text": "venimos a cantar en la fracción del pan", "bold": false}, {"text": "que nuestra fuente es el Dios de la Vida", "bold": false}, {"text": "", "bold": false}, {"text": "VENGA A NOSOTROS TU REINO DE AMOR,", "bold": true}, {"text": "PON A TU PUEBLO DE PIE.", "bold": true}, {"text": "CELEBRAREMOS CONTIGO, SEÑOR,", "bold": true}, {"text": "RENUEVA NUESTRA ESPERANZA.", "bold": true}, {"text": "CELEBRAREMOS CONTIGO, SEÑOR,", "bold": true}, {"text": "UNA FIESTA DE NUEVA ALIANZA.", "bold": true}]}, {"number": "012", "title": "Vienen con alegría", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "VIENEN CON ALEGRÍA SEÑOR,", "bold": true}, {"text": "CANTANDO VIENEN CON ALEGRÍA, SEÑOR,", "bold": true}, {"text": "LOS QUE CAMINAN POR LA VIDA, SEÑOR,", "bold": true}, {"text": "SEMBRANDO TU PAZ Y AMOR.", "bold": true}, {"text": "", "bold": false}, {"text": "Vienen trayendo la esperanza", "bold": false}, {"text": "a un mundo cargado de ansiedad", "bold": false}, {"text": "a un mundo que busca y que no alcanza", "bold": false}, {"text": "caminos de amor y de amistad.", "bold": false}, {"text": "", "bold": false}, {"text": "Vienen trayendo entre sus manos", "bold": false}, {"text": "esfuerzos de hermanos por la paz,", "bold": false}, {"text": "deseos de un mundo más humano", "bold": false}, {"text": "que nacen del bien y la verdad.", "bold": false}]}, {"number": "013", "title": "Vine a alabar a Dios", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "VINE A ALABAR A DIOS,", "bold": true}, {"text": "VINE A ALABAR A DIOS,", "bold": true}, {"text": "VINE A ALABAR SU NOMBRE,", "bold": true}, {"text": "VINE A ALABAR A DIOS", "bold": true}, {"text": "", "bold": false}, {"text": "El vino a mi vida en un día muy especial", "bold": false}, {"text": "Cambió mi Corazón", "bold": false}, {"text": "en un nuevo corazón", "bold": false}, {"text": "Y esta es la razón por la que digo que", "bold": false}, {"text": "Vine a alabar a Dios", "bold": false}]}, {"number": "014", "title": "Vuelve a casa", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Señor quiero contarte,", "bold": false}, {"text": "Algo que me esta pasando", "bold": false}, {"text": "En medio de este silencio,", "bold": false}, {"text": "Una voz me esta llamando", "bold": false}, {"text": "", "bold": false}, {"text": "Es una voz que me dice,", "bold": false}, {"text": "Que les diga a mis hermanos", "bold": false}, {"text": "Con gozo y con alegría,", "bold": false}, {"text": "Poniendo mi canto en alto", "bold": false}, {"text": "", "bold": false}, {"text": "VUELVE A CASA HERMANO MIO", "bold": true}, {"text": "VUELVE A CASA", "bold": true}, {"text": "QUE EL SEÑOR CON AMOR", "bold": true}, {"text": "SE ALEGRARÁ Y TE ABRAZARÁ", "bold": true}, {"text": "YA NO PIENSES EN AQUELLO", "bold": true}, {"text": "QUE UNA VEZ TE HIZO ALEJAR", "bold": true}, {"text": "PUES SABER ARREPENTIRSE", "bold": true}, {"text": "ES QUERER HAYAR LA PAZ", "bold": true}, {"text": "", "bold": false}, {"text": "GLORIAGLORIA", "bold": true}]}, {"number": "015", "title": "Gloria a Dios en el cielo", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "GLORIA A DIOS EN EL CIELO", "bold": true}, {"text": "¡Y EN LA TIERRA, PAZ A LOS HOMBRES!", "bold": true}, {"text": "", "bold": false}, {"text": "Gloria a Vos, Padre nuestro, Poder y Amor,", "bold": false}, {"text": "que hiciste de la nada la creación", "bold": false}, {"text": "y por salvar al mundo de su pecado", "bold": false}, {"text": "Gloria a Vos, Jesucristo, Dios hecho hombre,", "bold": false}, {"text": "que llevaste en tu carne nuestros dolores,", "bold": false}, {"text": "que venciste a la muerte crucificado,", "bold": false}, {"text": "y reinas junto al Padre resucitado.", "bold": false}, {"text": "", "bold": false}, {"text": "Gloria a Vos, Santo Espíritu, Viento y Fuego,", "bold": false}, {"text": "que hiciste de los pueblos un solo pueblo,", "bold": false}, {"text": "que animas a la Iglesia con tu aliento", "bold": false}, {"text": "para que anuncie al mundo el Evangelio.", "bold": false}, {"text": "", "bold": false}, {"text": "OFERTORIOOFERTORIO", "bold": true}]}, {"number": "016", "title": "Alimento que da vida", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "El Señor está aquí  para iluminar,", "bold": false}, {"text": "con el pan y el vino, me transformará.", "bold": false}, {"text": "", "bold": false}, {"text": "El Señor está aquí  para abrazar,", "bold": false}, {"text": "con el pan y el vino, te transformará.", "bold": false}, {"text": "", "bold": false}, {"text": "JESÚS, ALIMENTO QUE DA VIDA,", "bold": true}, {"text": "JESÚS, QUE ABUNDANTE SERÁ,", "bold": true}, {"text": "JESÚS, COMO AGUA VIVA", "bold": true}, {"text": "QUIERO LLEVAR EL MISMO AMOR.", "bold": true}, {"text": "", "bold": false}, {"text": "El Señor está aquí  para vida dar", "bold": false}, {"text": "con el pan y el vino, nos transformará.", "bold": false}]}, {"number": "017", "title": "Cinco panes y dos peces", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Yo soy un mendigo de tu gracia,", "bold": false}, {"text": "soy sólo un ladrón de tu amor.", "bold": false}, {"text": "Perderte sería mi desgracia,", "bold": false}, {"text": "no te vayas nunca mi Señor.", "bold": false}, {"text": "", "bold": false}, {"text": "SEÑOR, TENGO CINCO PANES Y DOS PECES", "bold": true}, {"text": "Y VEO TANTO HAMBRE A MI ALREDEDOR.", "bold": true}, {"text": "LOS PONGO EN TUS MANOS,", "bold": true}, {"text": "DALE DE COMER A MIS HERMANOS.", "bold": true}, {"text": "¡AQUÍ ESTÁ TU SIERVO, MI SEÑOR!", "bold": true}, {"text": "", "bold": false}, {"text": "Y cuando te pierdo, pierdo la calma.", "bold": false}, {"text": "Soy un débil que se protege en Dios.", "bold": false}, {"text": "En tu amor se limpia toda mi alma.", "bold": false}, {"text": "Soy un ambicioso lléname de vos.", "bold": false}]}, {"number": "018", "title": "Coplas de Yaraví", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Señor que nuestra vida sea", "bold": false}, {"text": "como una quena simple y recta,", "bold": false}, {"text": "para que Tú puedas llenarla;", "bold": false}, {"text": "llenarla con tu música. (bis)", "bold": false}, {"text": "", "bold": false}, {"text": "Señor que nuestra vida sea", "bold": false}, {"text": "arcilla blanda entre tus manos,", "bold": false}, {"text": "para que tú puedas formarla,", "bold": false}, {"text": "formarla a tu manera. (bis)", "bold": false}, {"text": "", "bold": false}, {"text": "Señor, que nuestra vida sea", "bold": false}, {"text": "semilla suelta por el aire,", "bold": false}, {"text": "para que Tú puedas sembrarla", "bold": false}, {"text": "Señor que nuestra vida sea", "bold": false}, {"text": "leñita humilde y siempre seca,", "bold": false}, {"text": "para que Tú puedas quemarla,", "bold": false}, {"text": "quemarla para el pobre. (bis)", "bold": false}]}, {"number": "019", "title": "Esto que soy esto te doy", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "A veces te pregunto \"¿por qué yo?\"", "bold": false}, {"text": "y sólo me respondes \"porque quiero\".", "bold": false}, {"text": "Es un misterio grande que nos llames", "bold": false}, {"text": "así, tal como somos, a tu encuentro.", "bold": false}, {"text": "", "bold": false}, {"text": "Entonces redescubro una verdad:", "bold": false}, {"text": "mi vida, nuestra vida es tu tesoro.", "bold": false}, {"text": "Se trata entonces, sólo de ofrecerte", "bold": false}, {"text": "con todo nuestro amor esto que somos.", "bold": false}, {"text": "", "bold": false}, {"text": "¿QUÉ TE DARÉ? ¿QUÉ TE DAREMOS?", "bold": true}, {"text": "SI TODO, TODO ES TU REGALO", "bold": true}, {"text": "TE OFRECERÉ, TE OFRECEREMOS", "bold": true}, {"text": "ESTO QUE SOMOS,", "bold": true}, {"text": "ESTO QUE SOY, ESO TE DOY.", "bold": true}, {"text": "", "bold": false}, {"text": "Esto que soy, esto es lo que te doy.", "bold": false}, {"text": "Esto que somos, es lo que te damos.", "bold": false}, {"text": "Tú no desprecias nuestra vida humilde,", "bold": false}, {"text": "se trata de poner todo en tus manos.", "bold": false}, {"text": "", "bold": false}, {"text": "Aquí van mis trabajos y mi fe,", "bold": false}, {"text": "mis mates, mis bajones y mis sueños,", "bold": false}, {"text": "y todas las personas que me diste", "bold": false}, {"text": "desde mi corazón te las ofrezco.", "bold": false}]}, {"number": "020", "title": "Mi reino", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Mi Reino es un grano de mostaza,", "bold": false}, {"text": "Que alguien en la tierra sembrara", "bold": false}, {"text": "Y que cuando crezca será grande,", "bold": false}, {"text": "Las aves en el anidaran.", "bold": false}, {"text": "", "bold": false}, {"text": "Es también como la levadura", "bold": false}, {"text": "Que toma en sus manos la mujer", "bold": false}, {"text": "Y que si la mezclas con la harina,", "bold": false}, {"text": "Fermenta y la masa hace crecer.", "bold": false}, {"text": "", "bold": false}, {"text": "Tú tienes mi Reino entre tus manos,", "bold": false}, {"text": "Trabaja para que pueda ser,", "bold": false}, {"text": "Tu eres la semilla y el fermento,", "bold": false}, {"text": "Haz que otros en mi puedan creer", "bold": false}]}, {"number": "021", "title": "Padre de Jesús bendice", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Este es el momento de alegrar la mesa", "bold": false}, {"text": "con el vino y con el pan,", "bold": false}, {"text": "que consagraremos", "bold": false}, {"text": "y que ofreceremos", "bold": false}, {"text": "y que hemos de comulgar.", "bold": false}, {"text": "", "bold": false}, {"text": "Este es el momento de llegar confiados", "bold": false}, {"text": "a la mesa del altar,", "bold": false}, {"text": "porque tu palabra, vivificadora", "bold": false}, {"text": "nos acaba de llamar.", "bold": false}, {"text": "PADRE DE JESÚS BENDICE", "bold": true}, {"text": "LO QUE PRESENTAMOS HOY,", "bold": true}, {"text": "Y QUE AL PREPARAR LA MESA", "bold": true}, {"text": "SE RENUEVE EL GOZO", "bold": true}, {"text": "DE SABER TU AMOR. (BIS)", "bold": true}, {"text": "", "bold": false}, {"text": "Pan de nuestras vidas, pan de nuestras manos,", "bold": false}, {"text": "pan de nuestra juventud.", "bold": false}, {"text": "pan que hoy entregamos", "bold": false}, {"text": "juntos como hermanos", "bold": false}, {"text": "en señal de gratitud.", "bold": false}, {"text": "", "bold": false}, {"text": "Vino de la tierra buena y generosa,", "bold": false}, {"text": "vino que ofrecemos hoy,", "bold": false}, {"text": "lleva nuestras luchas,", "bold": false}, {"text": "lleva nuestras penas,", "bold": false}, {"text": "lleva nuestra sed de amor.", "bold": false}]}, {"number": "022", "title": "Padre me pongo en Tus manos", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Padre me pongo en tus manos", "bold": false}, {"text": "haz de mí lo que quieras", "bold": false}, {"text": "sea lo que sea, te doy gracias.", "bold": false}, {"text": "Estoy dispuesto a todo, lo acepto todo", "bold": false}, {"text": "con tal que tu voluntad se cumpla en mí.", "bold": false}, {"text": "No deseo nada más", "bold": false}, {"text": "te confío mi alma", "bold": false}, {"text": "te la doy con todo el amor", "bold": false}, {"text": "del que soy capaz.", "bold": false}, {"text": "Porque te amo y necesito darme", "bold": false}, {"text": "ponerme en tus manos, porque eres mi padre.", "bold": false}]}, {"number": "023", "title": "Para darlo a los demás", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "A veces me siento alejado", "bold": false}, {"text": "y la vergüenza no me deja ni hablar.", "bold": false}, {"text": "Sólo sé que me duele verte clavado", "bold": false}, {"text": "porque me olvido de lo mucho que me amás.", "bold": false}, {"text": "", "bold": false}, {"text": "QUIERO VOLVER A SERTE FIEL.", "bold": true}, {"text": "QUIERO VOLVER A SERTE FIEL.", "bold": true}, {"text": "", "bold": false}, {"text": "TOMA DE MÍ LO QUE TE SIRVA", "bold": true}, {"text": "PARA DARLO A LOS DEMÁS.", "bold": true}, {"text": "TOMA DE MÍ LO QUE TE SIRVA", "bold": true}, {"text": "NO ME GUARDO NADA MÁS.", "bold": true}, {"text": "HOY QUIERO SER TU INSTRUMENTO", "bold": true}, {"text": "PREDICAR TU GRAN VERDAD,", "bold": true}, {"text": "LA DE TU PALABRA, LA DE TU CUERPO,", "bold": true}, {"text": "LA DE TU AMOR ETERNO,", "bold": true}, {"text": "LA DE AMAR AL MÁS PEQUEÑO.", "bold": true}, {"text": "", "bold": false}, {"text": "Y trato de encontrarte en mis hermanos", "bold": false}, {"text": "pero se me hace imposible sin tu amor.", "bold": false}, {"text": "Soy débil y te pido que tus manos", "bold": false}, {"text": "abran de par en par mi corazón.", "bold": false}]}, {"number": "024", "title": "Quiero ser pan", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Es joven el que espera,", "bold": false}, {"text": "el que sabe caminar,", "bold": false}, {"text": "el que lucha por el Reino", "bold": false}, {"text": "sin  ol er la  ista atrás", "bold": false}, {"text": "El que da su mano a otro,", "bold": false}, {"text": "el que sabe transformar,", "bold": false}, {"text": "el que es pan para los pobres,", "bold": false}, {"text": "defendiendo la verdad.", "bold": false}, {"text": "", "bold": false}, {"text": "QUIERO SER PAN,", "bold": true}, {"text": "PARA EL HAMBRE SER EL PAN,", "bold": true}, {"text": "DE MI PUEBLO Y CONSTRUIR", "bold": true}, {"text": "EL ESCÁNDALO DE COMPARTIR.", "bold": true}, {"text": "", "bold": false}, {"text": "Es joven el que arriesga,", "bold": false}, {"text": "el que sabe caminar,", "bold": false}, {"text": "el que siempre se pregunta", "bold": false}, {"text": "sin volver la vista atrás.", "bold": false}, {"text": "", "bold": false}, {"text": "El que sabe hacer historia,", "bold": false}, {"text": "el que sabe transformar,", "bold": false}, {"text": "el que es voz de los pequeños,", "bold": false}, {"text": "defendiendo la verdad.", "bold": false}, {"text": "", "bold": false}, {"text": "El que sigue a Jesús pobre,", "bold": false}, {"text": "el que sabe caminar,", "bold": false}, {"text": "el que apoya la justicia", "bold": false}, {"text": "sin volver la vista atrás.", "bold": false}, {"text": "", "bold": false}, {"text": "El que vive siempre abierto,", "bold": false}, {"text": "el que sabe transformar,", "bold": false}, {"text": "el que canta con los otros,", "bold": false}, {"text": "defendiendo la verdad.", "bold": false}]}, {"number": "025", "title": "Te ofrecemos Padre Nuestro", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "TE OFRECEMOS, PADRE NUESTRO", "bold": true}, {"text": "CON EL VINO Y CON EL PAN", "bold": true}, {"text": "NUESTRAS PENAS Y ALEGRÍAS,", "bold": true}, {"text": "EL TRABAJO Y NUESTRO AFÁN.", "bold": true}, {"text": "", "bold": false}, {"text": "Como el trigo de los campos", "bold": false}, {"text": "bajo el signo de la cruz,", "bold": false}, {"text": "se transformen nuestras vidas", "bold": false}, {"text": "en el Cuerpo de Jesús.", "bold": false}, {"text": "", "bold": false}, {"text": "A los pobres de la Tierra", "bold": false}, {"text": "a los que sufriendo están,", "bold": false}, {"text": "cambia su dolor en vino", "bold": false}, {"text": "como la uva en lagar.", "bold": false}, {"text": "", "bold": false}, {"text": "Estos dones son el signo", "bold": false}, {"text": "del esfuerzo de unidad,", "bold": false}, {"text": "que los hombres realizamos", "bold": false}, {"text": "en el campo y la ciudad.", "bold": false}]}, {"number": "026", "title": "Toma", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Toma, que tu cuerpo sea mi cuerpo", "bold": false}, {"text": "que tu sangre sea mi sangre", "bold": false}, {"text": "que tu luz sea mi ciudad.", "bold": false}, {"text": "", "bold": false}, {"text": "Deja que penetre en tu misterio", "bold": false}, {"text": "que me hunda en tu palabra", "bold": false}, {"text": "tómame Señor", "bold": false}, {"text": "MAS TÓMAME Y FÚNDEME EN TI", "bold": true}, {"text": "QUE OLVIDE MI AYER", "bold": true}, {"text": "QUE VUELVA A CREER.", "bold": true}, {"text": "Y ASÍ PODER VOLVER A GRITAR", "bold": true}, {"text": "QUE VIVO TU AMOR", "bold": true}, {"text": "QUE VOY HACIA TI.", "bold": true}]}, {"number": "027", "title": "Se como el grano de trigo", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "SÉ COMO EL GRANO DE TRIGO QUE CAE", "bold": true}, {"text": "EN TIERRA Y DESAPARECE.", "bold": true}, {"text": "Y AUNQUE TE DUELA LA MUERTE DE HOY,", "bold": true}, {"text": "MIRA LA ESPIGA QUE CRECE.", "bold": true}, {"text": "", "bold": false}, {"text": "Un trigal será mi Iglesia", "bold": false}, {"text": "que tomará mis entregas,", "bold": false}, {"text": "fecundadas por la sangre de Aquél", "bold": false}, {"text": "que dio su vida por ella.", "bold": false}, {"text": "", "bold": false}, {"text": "Ciudad nueva del amor,", "bold": false}, {"text": "donde vivirá el pueblo", "bold": false}, {"text": "que en los brazos de su dueño nació,", "bold": false}, {"text": "sostenido de un madero.", "bold": false}, {"text": "", "bold": false}, {"text": "Yo mi vida he de entregar,", "bold": false}, {"text": "para aumentar la cosecha", "bold": false}, {"text": "que el sembrador al final buscará", "bold": false}, {"text": "y dejará ser eterna.", "bold": false}, {"text": "", "bold": false}, {"text": "Y un día al Padre volveré,", "bold": false}, {"text": "a descubrir el secreto", "bold": false}, {"text": "de la pequeña semilla que fiel", "bold": false}, {"text": "cobró su herencia en el cielo.", "bold": false}]}, {"number": "028", "title": "Yo me entrego", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "En esta ofrenda te doy todo mi corazón", "bold": false}, {"text": "Mi cruz y mis tormentas, y mí falta de amor.", "bold": false}, {"text": "Te doy mi vida entera, para hacerla mejor.", "bold": false}, {"text": "Haz de mi lo que quieras, soy tu siervo Señor.", "bold": false}, {"text": "", "bold": false}, {"text": "Y AHORA YO ME ENTREGO,", "bold": true}, {"text": "JUNTO EL VINO Y JUNTO AL PAN.", "bold": true}, {"text": "TE ENTREGO MI VIDA ENTERA,", "bold": true}, {"text": "SER PAN PARA LOS DEMÁS.", "bold": true}, {"text": "", "bold": false}, {"text": "Te olvidaste de vos, una tarde de amor", "bold": false}, {"text": "Te acordaste de mí, que por tu muerte viví.", "bold": false}, {"text": "Te humillante vos Dios, esa era tu misión", "bold": false}, {"text": "Entregarte en la cruz, como ofrenda de amor.", "bold": false}]}, {"number": "029", "title": "Zamba del grano de trigo", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Zamba del grano de trigo", "bold": false}, {"text": "mañana yo he de ser pan;", "bold": false}, {"text": "no le tengo miedo al surco,", "bold": false}, {"text": "algún día he de brotar. (bis)", "bold": false}, {"text": "", "bold": false}, {"text": "Barbecho de terrón fresco", "bold": false}, {"text": "tu sangre yo he de mamar;", "bold": false}, {"text": "tierra que serás mi madre,", "bold": false}, {"text": "un nuevo ser me has de dar. (bis)", "bold": false}, {"text": "Silencio y noche en mi tumba", "bold": false}, {"text": "espigas germinarán;", "bold": false}, {"text": "ciento por uno y molienda", "bold": false}, {"text": "mañana voy a de ser pan. (bis)", "bold": false}, {"text": "", "bold": false}, {"text": "La muerte aguarda en el surco,", "bold": false}, {"text": "cálido abrazo nupcial;", "bold": false}, {"text": "muerte, sabrás un secreto:", "bold": false}, {"text": "cuando matas, vida das. (bis)", "bold": false}, {"text": "", "bold": false}, {"text": "Me enterraré en tus entrañas", "bold": false}, {"text": "y el mundo me olvidará;", "bold": false}, {"text": "es doloroso tu abrazo,", "bold": false}, {"text": "pero yo quiero ser pan. (bis)", "bold": false}, {"text": "", "bold": false}, {"text": "Tallo verde en dos hojitas", "bold": false}, {"text": "mi espiga despuntará;", "bold": false}, {"text": "ciento por uno y molienda,", "bold": false}, {"text": "mañana voy a ser pan.", "bold": false}, {"text": "", "bold": false}, {"text": "COMUNIÓNCOMUNIÓN", "bold": true}]}, {"number": "030", "title": "Alma misionera", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Señor, toma mi vida nueva", "bold": false}, {"text": "Antes de que la espera", "bold": false}, {"text": "Desgaste años en mi", "bold": false}, {"text": "Estoy dispuesto a lo que quieras", "bold": false}, {"text": "No importa lo que sea", "bold": false}, {"text": "Tu llámame a servir", "bold": false}, {"text": "", "bold": false}, {"text": "LLÉVAME DONDE LOS HOMBRES", "bold": true}, {"text": "NECESITEN TUS PALABRAS", "bold": true}, {"text": "NECESITEN, MIS GANAS DE VIVIR", "bold": true}, {"text": "DONDE FALTE LA ESPERANZA", "bold": true}, {"text": "DONDE TODO SEA TRISTE SIMPLEMENTE", "bold": true}, {"text": "POR NO SABER DE TI", "bold": true}, {"text": "", "bold": false}, {"text": "Te doy, mi corazón sincero", "bold": false}, {"text": "Para gritar sin miedo", "bold": false}, {"text": "Lo hermoso que es tu amor", "bold": false}, {"text": "Tendré mis manos sin cansancio", "bold": false}, {"text": "Tu historia entre mis labios", "bold": false}, {"text": "Y fuerza en la oración", "bold": false}, {"text": "Lévame donde los hombres", "bold": false}, {"text": "", "bold": false}, {"text": "Y así, en marcha iré cantando", "bold": false}, {"text": "Por pueblos predicando", "bold": false}, {"text": "Tu grandeza señor", "bold": false}, {"text": "Señor, tengo alma misionera", "bold": false}, {"text": "Condúceme a la tierra", "bold": false}, {"text": "Que tenga sed de Dios", "bold": false}]}, {"number": "031", "title": "A veces", "lines": [{"text": "ENTRADA", "bold": false}]}, {"number": "032", "title": "Camino", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Muy despacio te acercaste", "bold": false}, {"text": "en mi historia involucraste", "bold": false}, {"text": "Un milagro de esperanza fe y amor.", "bold": false}, {"text": "", "bold": false}, {"text": "Con preguntas y enseñanzas", "bold": false}, {"text": "Nos mostraste Sus andanzas", "bold": false}, {"text": "Y que el camino del Señor en ti vivió", "bold": false}, {"text": "", "bold": false}, {"text": "Y cautivó, el corazón", "bold": false}, {"text": "De todo aquel que en la noche te invito", "bold": false}, {"text": "", "bold": false}, {"text": "AL PARTIR EL PAN RENUEVA MI FE", "bold": true}, {"text": "UN HOMBRE QUE CON SU VIDA ME ELEVA", "bold": true}, {"text": "Y ME INVITA A ENTREGAR.", "bold": true}, {"text": "¿CÓMO PUDO SER", "bold": true}, {"text": "¿TAN DIFÍCIL CREER?", "bold": true}, {"text": "¿ACASO MI CORAZÓN NO ARDÍA", "bold": true}, {"text": "AL ESTAR CON ÉL?", "bold": true}, {"text": "", "bold": false}, {"text": "Ahora, aunque no lo vea", "bold": false}, {"text": "Yo ya sé que Él me espera.", "bold": false}, {"text": "Y mi Ser un solo Norte puede ver.", "bold": false}, {"text": "Regalarme a mis hermanos,", "bold": false}, {"text": "Atenderlos y escucharlos", "bold": false}, {"text": "Y con ellos a Jesús reconocer.", "bold": false}, {"text": "", "bold": false}, {"text": "Se que lo que quiero es un gran sueño,", "bold": false}, {"text": "Pero junto al Padre de los cielos", "bold": false}, {"text": "Y con su espíritu de Amor voy a llegar.", "bold": false}]}, {"number": "033", "title": "Canción al corazón de Jesús", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Quiero hablar de un amor infinito", "bold": false}, {"text": "que se vuelve niño frágil,", "bold": false}, {"text": "amor de hombre humillado.", "bold": false}, {"text": "Quiero hablar de un amor apasionado.", "bold": false}, {"text": "", "bold": false}, {"text": "Con dolor carga nuestros pecados", "bold": false}, {"text": "siendo rey se vuelve esclavo,", "bold": false}, {"text": "fuego de amor poderoso.", "bold": false}, {"text": "Salvador, humilde, fiel, silencioso.", "bold": false}, {"text": "", "bold": false}, {"text": "AMOR QUE ABRE SUS BRAZOS DE ACOGIDA,", "bold": true}, {"text": "QUIERO HABLAR DEL CAMINO", "bold": true}, {"text": "HACIA LA VIDA,", "bold": true}, {"text": "CORAZÓN PACIENTE, AMOR ARDIENTE.", "bold": true}, {"text": "QUIERO HABLAR DE AQUEL", "bold": true}, {"text": "QUE VENCE A LA MUERTE.", "bold": true}, {"text": "", "bold": false}, {"text": "Quiero hablar de un amor generoso,", "bold": false}, {"text": "que hace y calla, amor a todos", "bold": false}, {"text": "buscándonos todo el tiempo,", "bold": false}, {"text": "Esperando la respuesta, el encuentro.", "bold": false}, {"text": "", "bold": false}, {"text": "Quiero hablar de un amor diferente,", "bold": false}, {"text": "misterioso, inclaudicable,", "bold": false}, {"text": "amor que vence en la cruz.", "bold": false}, {"text": "Quiero hablar del corazón de Jesús.", "bold": false}]}, {"number": "034", "title": "Canción de la alianza", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "El que no ama a Dios no ha conocido,", "bold": false}, {"text": "porque a Dios en el amor se lo conoce. (bis)", "bold": false}, {"text": "", "bold": false}, {"text": "TENEMOS UN DIOS,", "bold": true}, {"text": "QUÉ GRANDE ES MI DIOS.", "bold": true}, {"text": "TENEMOS UN DIOS Y DIOS ES AMOR. (BIS)", "bold": true}, {"text": "", "bold": false}, {"text": "El amor del Padre, entregado al mundo,", "bold": false}, {"text": "se mostró en Jesús para que creyendo,", "bold": false}, {"text": "para que creyendo por él vivamos,", "bold": false}, {"text": "por él vivamos.", "bold": false}, {"text": "", "bold": false}, {"text": "Nosotros sabemos que hemos pasado", "bold": false}, {"text": "de la muerte a la vida porque nos amamos,", "bold": false}, {"text": "porque nos amamos", "bold": false}, {"text": "y nos aliamos a los hermanos.", "bold": false}]}, {"number": "035", "title": "Canción de madrugada", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Voy a Vos, recorriendo mi desierto", "bold": false}, {"text": "con el corazón despierto", "bold": false}, {"text": "por tu cruz y tu amistad.", "bold": false}, {"text": "Esa cruz clavó mi alma con tu cuerpo", "bold": false}, {"text": "pero sé que no estás muerto", "bold": false}, {"text": "OH JESÚS, SÉ QUE ESTÁS, VIVO,", "bold": true}, {"text": "SI VOS VIVÍS, YO TAMBIÉN ESTOY VIVO.", "bold": true}, {"text": "", "bold": false}, {"text": "No es verdad que esa noche hayan quedado", "bold": false}, {"text": "para siempre silenciados", "bold": false}, {"text": "tu mirada y tu abrazo.", "bold": false}, {"text": "Regresé, yo soy la vida entregada", "bold": false}, {"text": "y al alba resucitada,", "bold": false}, {"text": "viviente vencedor.", "bold": false}, {"text": "", "bold": false}, {"text": "No es verdad que lo turbio de mi vida,", "bold": false}, {"text": "mi vergüenza, mis heridas", "bold": false}, {"text": "son más fuertes que tu amor.", "bold": false}, {"text": "Si en la cruz al ladrón le diste abrigo", "bold": false}, {"text": "es que tu nombre es Amigo,", "bold": false}, {"text": "tu regalo el perdón.", "bold": false}, {"text": "", "bold": false}, {"text": "Sí, Jesús, sos aquel en quién creemos,", "bold": false}, {"text": "al que amamos y no vemos,", "bold": false}, {"text": "nuestro hermano nuestro Dios.", "bold": false}, {"text": "Llámanos, te escuchamos y seguimos", "bold": false}, {"text": "que es verdad que estamos vivos,", "bold": false}, {"text": "nuestra vida sos Vos", "bold": false}]}, {"number": "036", "title": "Cartas de san Pablo", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Si yo hablara todas las lenguas de la Tierra", "bold": false}, {"text": "pero no tengo amor,", "bold": false}, {"text": "soy como un bronce que retiñe,", "bold": false}, {"text": "un címbalo que resuena.", "bold": false}, {"text": "", "bold": false}, {"text": "Si yo tuviera el don de profecía", "bold": false}, {"text": "y conociera todas las ciencias;", "bold": false}, {"text": "si tuviera la fe de transportar", "bold": false}, {"text": "las montañas, pero no tengo amor,", "bold": false}, {"text": "", "bold": false}, {"text": "YO SOY NADA, PORQUE EL HOMBRE", "bold": true}, {"text": "NO ES HOMBRE SINO AMA.", "bold": true}, {"text": "", "bold": false}, {"text": "Si yo diera a los pobres todos mis bienes", "bold": false}, {"text": "y mi cuerpo entregara a las llamas,", "bold": false}, {"text": "pero no tengo amor, de nada me sirve.", "bold": false}, {"text": "", "bold": false}, {"text": "PASARÁN LAS PROFECÍAS,", "bold": true}, {"text": "CESARÁN TODAS LAS LENGUAS,", "bold": true}, {"text": "LA TIERRA UN DÍA ACABARÁ.", "bold": true}, {"text": "", "bold": false}, {"text": "Pero el amor nunca morirá,", "bold": false}, {"text": "porque todo cree, todo espera,", "bold": false}, {"text": "todo cubre, todo sufre,", "bold": false}, {"text": "mas goza de la verdad.", "bold": false}]}, {"number": "037", "title": "Como Cristo nos amó", "lines": [{"text": "ENTRADA", "bold": false}]}, {"number": "038", "title": "Como en Emaús", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Nos acercamos con alegría", "bold": false}, {"text": "A recibirte Señor Jesús", "bold": false}, {"text": "Con tu presencia nos iluminas", "bold": false}, {"text": "Como lo hiciste en Emaús.", "bold": false}, {"text": "", "bold": false}, {"text": "Necesitados de tu consuelo", "bold": false}, {"text": "vamos en busca del mismo pan", "bold": false}, {"text": "que nos dejaste como alimento", "bold": false}, {"text": "en nuestro diario peregrinar", "bold": false}, {"text": "", "bold": false}, {"text": "TOMEN Y COMAN, ESTE ES MI CUERPO", "bold": true}, {"text": "TOMEN Y BEBAN, MI SANGRE ES", "bold": true}, {"text": "QUE POR USTEDES HOY YO ME ENTREGO,", "bold": true}, {"text": "Y CON USTEDES ME QUEDARÉ (BIS)", "bold": true}, {"text": "", "bold": false}, {"text": "Qué gran misterio, la Eucaristía", "bold": false}, {"text": "Principio y fuente de la unidad", "bold": false}, {"text": "que nos enseña a gustar la vida", "bold": false}, {"text": "y a compartirla con los demás.", "bold": false}, {"text": "", "bold": false}, {"text": "Gracias, Señor, por el pan del cielo", "bold": false}, {"text": "que recibimos de tu bondad", "bold": false}, {"text": "la iglesia vive en tu mismo cuerpo", "bold": false}, {"text": "al celebrar este Memorial.", "bold": false}, {"text": "", "bold": false}, {"text": "Dale, Señor, a tu pueblo Santo", "bold": false}, {"text": "tu compañía y tu bendición", "bold": false}, {"text": "que en las tristezas y en el cansancio", "bold": false}, {"text": "Que seamos uno y el mundo crea", "bold": false}, {"text": "al ver creyentes de corazón", "bold": false}, {"text": "que sin medida su vida entregan", "bold": false}, {"text": "como aprendimos de vos, Señor.", "bold": false}]}, {"number": "039", "title": "Dios te Salve", "lines": [{"text": "ENTRADA", "bold": false}]}, {"number": "040", "title": "Discípulos", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Diez mil ojos hoy han visto Tu poder", "bold": false}, {"text": "El milagro de una multiplicación", "bold": false}, {"text": "Hoy Tus manos han saciado Toda mi necesidad", "bold": false}, {"text": "Pero mi alma anhela más de Tu presencia", "bold": false}, {"text": "", "bold": false}, {"text": "NO QUIERO SER DE LOS CINCO MIL QUE", "bold": true}, {"text": "DISFRUTAN DEL MILAGRO", "bold": true}, {"text": "PREFIERO SER DE LOS DOCE", "bold": true}, {"text": "QUE RECOGEN LOS PEDAZOS", "bold": true}, {"text": "Y PASAR LA NOCHE EN VELA", "bold": true}, {"text": "JUNTOS SOBRE UN MAR DE SEDA", "bold": true}, {"text": "CONVERSAR CON EL MAESTRO", "bold": true}, {"text": "HASTA EL ALBA", "bold": true}, {"text": "", "bold": false}, {"text": "Sé que hay doce sestas más de provisión", "bold": false}, {"text": "Y Tus ojos aún me miran con amor", "bold": false}, {"text": "Yo no quiero regresar como aquella multitud", "bold": false}, {"text": "Déjame ser un discípulo, Señor", "bold": false}, {"text": "Ya no quiero sólo recibir Tu pan", "bold": false}, {"text": "Mi alma quiere conocerte de verdad", "bold": false}, {"text": "Habitar en Tu presencia, despertarme junto a Ti", "bold": false}, {"text": "Para que sea formada en mí Tu imagen porque", "bold": false}]}, {"number": "041", "title": "El pastor", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "En busca de hierbas más frescas y dulces", "bold": false}, {"text": "corrí del rebaño, dejé atrás al Pastor.", "bold": false}, {"text": "Ya se hizo de noche, qué oscura mi alma,", "bold": false}, {"text": "me acechan las fieras y sombras, del terror.", "bold": false}, {"text": "", "bold": false}, {"text": "EL PASTOR ME VIO PARTIR", "bold": true}, {"text": "Y POR UNA SOLA OVEJA", "bold": true}, {"text": "ÉL SE DECIDIÓ A VENIR.", "bold": true}, {"text": "ÉL ME ALZÓ CUANDO CAÍ Y,", "bold": true}, {"text": "A PESAR DE MIS HERIDAS,", "bold": true}, {"text": "SUPE QUE ESTANDO EN SUS HOMBROS", "bold": true}, {"text": "SOY FELIZ.", "bold": true}, {"text": "", "bold": false}, {"text": "Recorres mi senda, difícil, confusa.", "bold": false}, {"text": "Qué suaves tus pasos, y claro tu clamor.", "bold": false}, {"text": "Señor poderoso, riqueza infinita,", "bold": false}, {"text": "me muestras tu gloria sufriendo por amor.", "bold": false}]}, {"number": "042", "title": "El sediento", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Así cómo el sediento busca", "bold": false}, {"text": "la vertiente de agua fresca", "bold": false}, {"text": "Así mi corazón, te busca a ti Señor", "bold": false}, {"text": "Y cómo un hijo busca el abrazo de su padre", "bold": false}, {"text": "Así estoy yo, buscándote a ti Señor (bis)", "bold": false}, {"text": "", "bold": false}, {"text": "Y te busco, y te llamo,", "bold": false}, {"text": "te deseo dónde estás Señor (bis)", "bold": false}, {"text": "", "bold": false}, {"text": "Y tú te haces presente,", "bold": false}, {"text": "en el silencio te haces fuerte", "bold": false}, {"text": "No estoy solo, ahora contigo estoy", "bold": false}, {"text": "Me inundas de tu vida,", "bold": false}, {"text": "en mí eres fuente de agua viva", "bold": false}, {"text": "Y te busco, y te llamo,", "bold": false}, {"text": "te deseo dónde estás Señor", "bold": false}, {"text": "Si me buscas, en tu hermano voy", "bold": false}, {"text": "Si me llamas, palabra viva soy", "bold": false}, {"text": "Me deseas, cuerpo y sangre derramado me doy", "bold": false}, {"text": "", "bold": false}, {"text": "Ahora puedo verte,", "bold": false}, {"text": "en tantos rostros tanta gente", "bold": false}, {"text": "Te descubro en cada situación", "bold": false}, {"text": "Tu palabra me guía y a la vez me desafía", "bold": false}, {"text": "A seguirte con toda mi pasión", "bold": false}]}, {"number": "043", "title": "Fruto nuevo de tu cielo", "lines": [{"text": "ENTRADA", "bold": false}]}, {"number": "044", "title": "Haciéndote pan", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Comenzaste a hacerte pan en Belén", "bold": false}, {"text": "sol pequeñito en esta noche.", "bold": false}, {"text": "Aprendiste en Nazaret de ellos dos", "bold": false}, {"text": "el gesto manso de la entrega.", "bold": false}, {"text": "", "bold": false}, {"text": "Niño que en Jerusalén", "bold": false}, {"text": "te entregaste de una vez", "bold": false}, {"text": "a las cosas de tu padre.", "bold": false}, {"text": "Debe tu cuerpo crecer,", "bold": false}, {"text": "para poderse ofrecer", "bold": false}, {"text": "como pan a nuestro hambre.", "bold": false}, {"text": "", "bold": false}, {"text": "MI CUERPO ES ESTO,", "bold": true}, {"text": "MI SANGRE ES ESTA", "bold": true}, {"text": "QUE POR USTEDES DOY", "bold": true}, {"text": "COMAN Y BEBAN, CREAN Y VIVAN", "bold": true}, {"text": "QUE PARA SIEMPRE SOY", "bold": true}, {"text": "SOY YO, SOY YO.", "bold": true}, {"text": "", "bold": false}, {"text": "Se multiplicó tu amor, se partió", "bold": false}, {"text": "todos saciados aún sobraba.", "bold": false}, {"text": "Se mostró tu intimidad eres pan", "bold": false}, {"text": "que sólo vive por donarse.", "bold": false}, {"text": "", "bold": false}, {"text": "Noches de Jerusalén", "bold": false}, {"text": "Cristo-Pan entrégate", "bold": false}, {"text": "eres tú nuestro cordero.", "bold": false}, {"text": "Cena, huerto, beso y cruz", "bold": false}, {"text": "y tu entrega Pan-Jesús", "bold": false}, {"text": "fue más fuerte que el madero.", "bold": false}]}, {"number": "045", "title": "Hazme pobre", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "HAZME POBRE, SIEMPRE POBRE.", "bold": true}, {"text": "QUE ME SIENTA TAN SEGURO DE MÍ MISMO.", "bold": true}, {"text": "Y MANTENME COMO LO QUE SOY,", "bold": true}, {"text": "UNA POBRE Y FRÁGIL VASIJA DE BARRO.", "bold": true}, {"text": "Y HAZME DÓCIL EN TUS MANOS, SEÑOR, EN", "bold": true}, {"text": "TUS MANOS.", "bold": true}, {"text": "", "bold": false}, {"text": "Hazme vulnerable frente a Ti y a mis hermanos.", "bold": false}, {"text": "Y mantén, mantén mis manos siempre abiertas", "bold": false}, {"text": "para pedir,", "bold": false}, {"text": "y nunca tan seguras para sólo dar.", "bold": false}, {"text": "", "bold": false}, {"text": "Hazme tu pequeño cántaro de barro,", "bold": false}, {"text": "muy contento de llevar un gran tesoro", "bold": false}, {"text": "dentro de mí,", "bold": false}, {"text": "mi gran tesoro, Tú, Jesús.", "bold": false}, {"text": "", "bold": false}, {"text": "Hazme pobre, siempre pobre.", "bold": false}, {"text": "Por favor, jamás permitas", "bold": false}, {"text": "que me sienta tan seguro de mí mismo.", "bold": false}, {"text": "Y mantenme como lo que soy,", "bold": false}, {"text": "una pobre y frágil vasija de barro.", "bold": false}, {"text": "Y hazme dócil en tus manos,", "bold": false}, {"text": "Señor, en tus manos.                                               sigue >", "bold": false}, {"text": "Porque es tu grandeza la", "bold": false}, {"text": "que habita en mi pobreza", "bold": false}, {"text": "Y en mi pequeñez, Señor,", "bold": false}, {"text": "brilla aún más tu fuerza.", "bold": false}, {"text": "Cuando soy débil, eres mi firmeza.", "bold": false}, {"text": "", "bold": false}, {"text": "Mándame hermanos que", "bold": false}, {"text": "me recuerden mi flaqueza.", "bold": false}, {"text": "Cantaré, así, tu gloria y tu poder por siempre.", "bold": false}, {"text": "En mi debilidad sé fuerte.", "bold": false}]}, {"number": "046", "title": "Jesús te seguiré", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "JESÚS TE SEGUIRE", "bold": true}, {"text": "DONDE ME LLEVES IRÉ", "bold": true}, {"text": "MUESTRAME ESE LUGAR DONDE VIVES", "bold": true}, {"text": "QUIERO QUEDARME CONTIGO ALLÍ", "bold": true}, {"text": "", "bold": false}, {"text": "Escuchando tus palabras", "bold": false}, {"text": "Algo nuevo nace en mi", "bold": false}, {"text": "Es que nadie nos había venido", "bold": false}, {"text": "A hablar así", "bold": false}, {"text": "Ahora veo claro La verdad esta en ti", "bold": false}, {"text": "Aleluya gloria señor", "bold": false}, {"text": "", "bold": false}, {"text": "Hoy he visto como se aman", "bold": false}, {"text": "Los que viven junto a ti", "bold": false}, {"text": "Hace tiempo que sediento", "bold": false}, {"text": "Había querido amar así", "bold": false}, {"text": "Ahora siento que tu amor", "bold": false}, {"text": "Viene hacia mi", "bold": false}, {"text": "", "bold": false}, {"text": "Hoy he visto a los leprosos sanos", "bold": false}, {"text": "Y a los ciegos ver", "bold": false}, {"text": "Hasta el pan multiplicarse", "bold": false}, {"text": "Para darnos a comer", "bold": false}, {"text": "Oh maestro mío Todo lo haces bien!", "bold": false}]}, {"number": "047", "title": "Partiendo el mismo pan", "lines": [{"text": "ENTRADA", "bold": false}]}, {"number": "048", "title": "Pescador de hombres", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Tú has venido a la orilla", "bold": false}, {"text": "no has buscado a sabios, ni a ricos", "bold": false}, {"text": "tan solo quieres que yo te siga", "bold": false}, {"text": "", "bold": false}, {"text": "SEÑOR, ME HAS MIRADO A LAS OJOS", "bold": true}, {"text": "SONRIENDO, HAS DICHO MI NOMBRE", "bold": true}, {"text": "EN LA ARENA, HE DEJADO MI BARCA", "bold": true}, {"text": "JUNTO A TI, BUSCARÉ OTRO MAR", "bold": true}, {"text": "", "bold": false}, {"text": "Tu necesitas mis manos", "bold": false}, {"text": "mis cansancios que a otros descansen", "bold": false}, {"text": "amor que quiero seguir amando", "bold": false}, {"text": "", "bold": false}, {"text": "Tu sabes bien lo que quiero", "bold": false}, {"text": "en mi barca no hay oro ni espadas", "bold": false}, {"text": "tan solo redes y mi trabajo.", "bold": false}]}, {"number": "049", "title": "Quiero ser santo", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Quiero ser santo Señor,", "bold": false}, {"text": "me cuesta tanto seguirte.", "bold": false}, {"text": "Quiero ser santo Señor,", "bold": false}, {"text": "porque vos me lo pediste.", "bold": false}, {"text": "", "bold": false}, {"text": "Y aunque me cueste,", "bold": false}, {"text": "aunque no pueda,", "bold": false}, {"text": "aunque reviente,", "bold": false}, {"text": "aunque me muera.", "bold": false}, {"text": "", "bold": false}, {"text": "SÓLO LANZADO A LA", "bold": true}, {"text": "AVENTURA DE TU AMOR", "bold": true}, {"text": "MI VIDA TIENE SENTIDO.", "bold": true}, {"text": "", "bold": false}, {"text": "Con los pies en la tierra", "bold": false}, {"text": "pero los ojos en el cielo.", "bold": false}, {"text": "Necesito tu mano", "bold": false}, {"text": "porque solo no puedo.", "bold": false}]}, {"number": "050", "title": "Vida en abundancia", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Los lirios del campo y las aves del cielo", "bold": false}, {"text": "No se preocupan por que están en mis manos.", "bold": false}, {"text": "Tené confianza en mi, acá estoy junto a vos.", "bold": false}, {"text": "", "bold": false}, {"text": "Amá lo que sos, y tus circunstancias.", "bold": false}, {"text": "Estoy con vos, con tu cruz en mi espalda.", "bold": false}, {"text": "Todo terminará bien,", "bold": false}, {"text": "yo hago nuevas todas las cosas.", "bold": false}, {"text": "", "bold": false}, {"text": "YO VENGO A TRAERTE VIDA,", "bold": true}, {"text": "VIDA EN ABUNDANCIA, EN ABUNDANCIA.", "bold": true}, {"text": "YO SOY EL CAMINO, LA VERDAD Y LA VIDA,", "bold": true}, {"text": "VIDA EN ABUNDANCIA, EN ABUNDANCIA.", "bold": true}, {"text": "", "bold": false}, {"text": "No hice al hombre para que esté solo,", "bold": false}, {"text": "caminen juntos como hermanos.", "bold": false}, {"text": "Sopórtense mutuamente, amensé unos a otros.", "bold": false}, {"text": "", "bold": false}, {"text": "La felicidad de la vida eterna,", "bold": false}, {"text": "empieza conmigo en la tierra.", "bold": false}, {"text": "Sentite vivo, la fiesta del reino comienza acá.", "bold": false}, {"text": "", "bold": false}, {"text": "VARIOSVARIOS", "bold": true}]}, {"number": "051", "title": "Alma de Cristo", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Alma de Cristo, santifícame", "bold": false}, {"text": "Cuerpo de Cristo, sálvame.", "bold": false}, {"text": "Sangre de Cristo, embriágame.", "bold": false}, {"text": "Agua de su costado, lávame.", "bold": false}, {"text": "", "bold": false}, {"text": "Pasión de Cristo, confórtame.", "bold": false}, {"text": "¡Oh, buen Jesús!, óyeme.", "bold": false}, {"text": "", "bold": false}, {"text": "Y dentro de tus llagas, escóndeme.", "bold": false}, {"text": "No permitas que me aparte de Ti.", "bold": false}, {"text": "Del maligno enemigo, defiéndeme.", "bold": false}, {"text": "Y En la hora de mi muerte, llámame.", "bold": false}, {"text": "", "bold": false}, {"text": "Y mándame ir a Ti.", "bold": false}, {"text": "", "bold": false}, {"text": "Para con tus santos te alabe", "bold": false}, {"text": "Por los siglos de los siglos, Amén.", "bold": false}]}, {"number": "052", "title": "Canción del sí", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Llamas y me ofreces con amor", "bold": false}, {"text": "construir un mundo mejor,", "bold": false}, {"text": "necesitas de mi sí.", "bold": false}, {"text": "Quieres que te siga hasta el fin,", "bold": false}, {"text": "que comprenda que sin mí,", "bold": false}, {"text": "muchos quedarán sin Ti.", "bold": false}, {"text": "", "bold": false}, {"text": "SI NO SOLAMENTE PORQUE SÍ,", "bold": true}, {"text": "SINO PORQUE YO JUNTO A TI", "bold": true}, {"text": "ENCUENTRO PAZ, SOY MUY FELIZ.", "bold": true}, {"text": "SÍ, AUNQUE NO ENTIENDA DIGO SÍ,", "bold": true}, {"text": "AUNQUE NO VEA DIGO SÍ", "bold": true}, {"text": "Sé que Tú no puedes esperar,", "bold": false}, {"text": "tengo que dejar mi plan,", "bold": false}, {"text": "tu camino vale más.", "bold": false}, {"text": "Soy la sal que Tú quieres echar,", "bold": false}, {"text": "luz que debe iluminar,", "bold": false}, {"text": "me elegiste para amar.", "bold": false}]}, {"number": "053", "title": "Cara a cara", "lines": [{"text": "ENTRADA", "bold": false}]}, {"number": "054", "title": "Con Vos", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Te alejaste de mí", "bold": false}, {"text": "Estás perdido, no encuentras sentido", "bold": false}, {"text": "Te avergüenza quien sos", "bold": false}, {"text": "Estás dolido, te sentís vacío", "bold": false}, {"text": "Elegí buscarte", "bold": false}, {"text": "Y llorar con vos, con tu corazón", "bold": false}, {"text": "Un corazón sediento", "bold": false}, {"text": "Herido por el tiempo", "bold": false}, {"text": "", "bold": false}, {"text": "VUELVE A CASA HOY (VUELVE A CASA HOY)", "bold": true}, {"text": "AQUÍ YO TE ESPERO, NO TENGAS MIEDO", "bold": true}, {"text": "VUELVE A CASA HOY (VUELVE A CASA HOY)", "bold": true}, {"text": "NECESITO VERTE", "bold": true}, {"text": "ELIJO TODO LO QUE SOS", "bold": true}, {"text": "QUIERO ESTAR CON VOS", "bold": true}, {"text": "QUIERO ESTAR CON VOS", "bold": true}, {"text": "", "bold": false}, {"text": "Cómo hacerte entender", "bold": false}, {"text": "Lo mucho que te quiero", "bold": false}, {"text": "Lo mucho que te espero", "bold": false}, {"text": "Espero para abrazar", "bold": false}, {"text": "Tu mundo entero", "bold": false}, {"text": "Con amor sincero", "bold": false}, {"text": "No importa lo que has hecho", "bold": false}, {"text": "Mi amor no cambió", "bold": false}, {"text": "Escuchá mi voz", "bold": false}, {"text": "Una voz compasiva", "bold": false}, {"text": "Vuelve a la vida", "bold": false}]}, {"number": "055", "title": "Cristo calla", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Si pudiera preguntarte tantas cosas,", "bold": false}, {"text": "aquellas que, por hombre, no comprendo.", "bold": false}, {"text": "Cómo pudiste abrigar un sentimiento", "bold": false}, {"text": "de tan inmenso amor y estar muriendo.", "bold": false}, {"text": "", "bold": false}, {"text": "Y cómo soportar que no entendieran", "bold": false}, {"text": "todo el dolor del mundo en tus espaldas.", "bold": false}, {"text": "Si hasta sudaste sangre en aquel huerto,", "bold": false}, {"text": "sintiendo la traición de aquel que ambas.", "bold": false}, {"text": "", "bold": false}, {"text": "TE DOLIÓ, TE DOLIÓ, TE DOLIÓ TANTO", "bold": true}, {"text": "QUE GOLPEARAN TU CUERPO", "bold": true}, {"text": "HASTA CANSARSE.", "bold": true}, {"text": "PERO, QUIZÁS,", "bold": true}, {"text": "TE DOLIERA MUCHO MÁS EL ALMA,", "bold": true}, {"text": "AL VER QUE NO ENTENDIERAN TU MENSAJE.", "bold": true}, {"text": "", "bold": false}, {"text": "¿Por qué callas Tú, Cristo, tantas veces?", "bold": false}, {"text": "¿Por qué dejas al hombre no escucharte?", "bold": false}, {"text": "¿Acaso fue tu amor tan infinito", "bold": false}, {"text": "que pudo con la angustia confortarte?", "bold": false}, {"text": "", "bold": false}, {"text": "Si aún llevas la cruz es por mi culpa,", "bold": false}, {"text": "no supe levantarla en su momento.", "bold": false}, {"text": "Por culpa, día a día, de mi ofensa,", "bold": false}, {"text": "hoy debes soportar el sufrimiento.", "bold": false}]}, {"number": "056", "title": "Dame tus ojos", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Dame tus ojos, quiero ver", "bold": false}, {"text": "Dame tus palabras, quiero hablar", "bold": false}, {"text": "Dame tu parecer", "bold": false}, {"text": "Dame tus pies, yo quiero ir", "bold": false}, {"text": "Dame tus deseos para sentir", "bold": false}, {"text": "Dame tu parecer", "bold": false}, {"text": "Dame lo que necesito", "bold": false}, {"text": "Para ser como vos", "bold": false}, {"text": "", "bold": false}, {"text": "DAME TU VOZ, DAME TU ALIENTO", "bold": true}, {"text": "TOMA MI TIEMPO ES PARA TI", "bold": true}, {"text": "DAME EL CAMINO QUE DEBO SEGUIR", "bold": true}, {"text": "DAME TUS SUEÑOS, TUS ANHELOS", "bold": true}, {"text": "TUS PENSAMIENTOS, TU SENTIR", "bold": true}, {"text": "DAME TU VIDA PARA VIVIR", "bold": true}, {"text": "", "bold": false}, {"text": "Déjame ver lo que tu ves", "bold": false}, {"text": "Dame de tu gracia, tu poder", "bold": false}, {"text": "Dame tu corazón", "bold": false}, {"text": "Déjame ver en tu interior", "bold": false}, {"text": "Para ser cambiado por tu amor", "bold": false}, {"text": "Dame tu corazón", "bold": false}]}, {"number": "057", "title": "Enciende una luz", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Enciende una luz, y déjala brillar", "bold": false}, {"text": "Es la luz de Jesús, que brille en todo lugar", "bold": false}, {"text": "No la puedes esconder, no la puedes callar", "bold": false}, {"text": "ante la necesidad enciende una luz", "bold": false}, {"text": "en la oscuridad.", "bold": false}, {"text": "", "bold": false}, {"text": "¿Como pues invocaran, a aquel en el cual", "bold": false}, {"text": "no han creído?", "bold": false}, {"text": "¿Y como creerán en aquel de quien", "bold": false}, {"text": "no han oído?", "bold": false}, {"text": "¿Y como oirán si nadie les predica?", "bold": false}, {"text": "Hermosos son lo pies de los que anuncian", "bold": false}, {"text": "la paz. Las buenas nuevas de Jesús.", "bold": false}]}, {"number": "058", "title": "Es el Señor", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Es el Señor,", "bold": false}, {"text": "el que quiere que le abra mi puerta.", "bold": false}, {"text": "Es El que quiere entrar en mí.", "bold": false}, {"text": "Es el Señor,", "bold": false}, {"text": "el que me pide permiso", "bold": false}, {"text": "para poder hacerme feliz.", "bold": false}, {"text": "", "bold": false}, {"text": "¿CÓMO NEGARME,", "bold": true}, {"text": "SI MI CORAZÓN SOLO ARDE", "bold": true}, {"text": "CON TU VOZ?", "bold": true}, {"text": "Y NUNCA DEJES", "bold": true}, {"text": "QUE EL PECADO EN MI VIDA ME ALEJE", "bold": true}, {"text": "DE TU AMOR.", "bold": true}, {"text": "", "bold": false}, {"text": "Solo te digo que sí.", "bold": false}, {"text": "A veces cuando tengo", "bold": false}, {"text": "mi mirada en Ti,", "bold": false}, {"text": "y alguna cosa me distrae,", "bold": false}, {"text": "entonces tengo miedo", "bold": false}, {"text": "i     h   di", "bold": false}]}, {"number": "059", "title": "Escúchame Dios", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Señor son tus ojos dolor y ternura,", "bold": false}, {"text": "tus manos llagadas, brindando amor", "bold": false}, {"text": "Y es tu palabra la fuente de vida,", "bold": false}, {"text": "que alumbra las almas que van a vos.", "bold": false}, {"text": "", "bold": false}, {"text": "ESCÚCHAME DIOS, ESCÚCHAME DIOS,", "bold": true}, {"text": "QUIERO LLEGAR, QUIERO LLEGAR,", "bold": true}, {"text": "AL HORIZONTE DONDE HAYA PAZ.", "bold": true}, {"text": "QUIERO SERVIR, QUIERO SERVIR,", "bold": true}, {"text": "HASTA MORIR, HASTA MORIR", "bold": true}, {"text": "A LOS HERMANOS QUE VEO EN TI.", "bold": true}, {"text": "", "bold": false}, {"text": "Tu corazón llora el pecado del hombre,", "bold": false}, {"text": "e invoca tu nombre tu redención.", "bold": false}, {"text": "Y con el sol, las tinieblas se alejan,", "bold": false}, {"text": "y arrepentido yo vuelvo a vos.", "bold": false}]}, {"number": "060", "title": "Estate", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Estate Señor conmigo", "bold": false}, {"text": "siempre y sin jamás partirte", "bold": false}, {"text": "y cuando decidas irte", "bold": false}, {"text": "llévame Señor contigo.", "bold": false}, {"text": "Porque pensar que te iras", "bold": false}, {"text": "me causa un terrible miedo", "bold": false}, {"text": "de si yo sin Ti me quedo", "bold": false}, {"text": "de si Tú sin mí te vas.", "bold": false}, {"text": "", "bold": false}, {"text": "Llévame en tu compañía", "bold": false}, {"text": "donde Tú vayas, Jesús", "bold": false}, {"text": "porque bien sé que eres Tú", "bold": false}, {"text": "la vida del alma mía.", "bold": false}, {"text": "Si tu vida no me das", "bold": false}, {"text": "yo sé que vivir no puedo", "bold": false}, {"text": "ni si yo sin Ti me quedo", "bold": false}, {"text": "ni si Tú sin mí te vas.", "bold": false}, {"text": "", "bold": false}, {"text": "Por eso y más que a la muerte", "bold": false}, {"text": "temo, Señor, tu partida", "bold": false}, {"text": "y quiero perder la vida", "bold": false}, {"text": "mil veces más que perderte.", "bold": false}, {"text": "Pues la inmortal que tú das", "bold": false}, {"text": "yo sé que alcanzarla no puedo", "bold": false}, {"text": "Cuando yo sin Ti me quedo", "bold": false}, {"text": "Cuando Tú sin mí te vas.", "bold": false}]}, {"number": "061", "title": "Jesús mi alegría", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Oh Jesús de dulcísima memoria,", "bold": false}, {"text": "que nos das la alegría verdadera,", "bold": false}, {"text": "más que miel y que toda otra cosa", "bold": false}, {"text": "nos infunde dulzura tu presencia.", "bold": false}, {"text": "", "bold": false}, {"text": "No habrá canto más suave al oído,", "bold": false}, {"text": "ni que grato resulte al escucharlo,", "bold": false}, {"text": "ni tan dulce para ser recordado,", "bold": false}, {"text": "como tú, oh Jesús, el Hijo amado.", "bold": false}, {"text": "EN JESÚS SE CONFÍA EL QUE SUFRE,", "bold": true}, {"text": "QUÉ PIADOSO TE MUESTRAS AL QUE RUEGA,", "bold": true}, {"text": "QUÉ BONDAD EN TI ENCUENTRA", "bold": true}, {"text": "EL QUE TE BUSCA,", "bold": true}, {"text": "QUÉ DICHOSO SERÁ EL QUE TE ENCUENTRA.", "bold": true}, {"text": "", "bold": false}, {"text": "No habrá lengua que pueda expresarlo,", "bold": false}, {"text": "ni palabra que pueda traducirlo,", "bold": false}, {"text": "pues tan sólo el que lo ha experimentado,", "bold": false}, {"text": "es capaz de saber lo que es amarlo.", "bold": false}]}, {"number": "062", "title": "Los yuyos de mi tierra", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Achicate hermano, no busques la loma.", "bold": false}, {"text": "Andá por los bajos, pisa el trebolar.", "bold": false}, {"text": "No temas el charco que el agua es playita,", "bold": false}, {"text": "y el barro del campo no sabe ensuciar.", "bold": false}, {"text": "", "bold": false}, {"text": "Si querés altura mira las estrellas,", "bold": false}, {"text": "donde anida el rumbo que conduce a Dios.", "bold": false}, {"text": "No niegues tu rostro al ala del viento,", "bold": false}, {"text": "ni cubras tu frente  por no ver el sol.", "bold": false}, {"text": "", "bold": false}, {"text": "NO VENDAS DISTANCIAS", "bold": true}, {"text": "POR COMPRAR SOSIEGO,", "bold": true}, {"text": "NO DEJES TAPERAS DESPUÉS DE ACAMPAR.", "bold": true}, {"text": "TENÉ FE EN LA HUELLA,", "bold": true}, {"text": "BUSCÁ EL HORIZONTE.", "bold": true}, {"text": "DE SEGURO UN DÍA", "bold": true}, {"text": "LO HABRÁS DE ALCANZAR.", "bold": true}, {"text": "", "bold": false}, {"text": "Florecé a los vientos como lo hace el cardo", "bold": false}, {"text": "que, llegado a seco, libera el pompón.", "bold": false}, {"text": "No apures la historia, no arríes tus banderas.", "bold": false}, {"text": "Confiá en tus hermanos, como ellos en vos.", "bold": false}, {"text": "", "bold": false}, {"text": "Vení, matearemos despacito juntos.", "bold": false}, {"text": "Me hablarás de lucha, te hablaré de fe,", "bold": false}, {"text": "y al final del día nos daremos cuenta", "bold": false}, {"text": "de que en igual senda andamos tal vez.", "bold": false}, {"text": "", "bold": false}, {"text": "CUANDO EL SOL SE VAYA Y LA TARDE CAIGA,", "bold": true}, {"text": "SE ABRIRÁN LOS OJOS AL PARTIR EL PAN.", "bold": true}, {"text": "Y ENTONCES SABREMOS", "bold": true}, {"text": "QUE POR EL CAMINO", "bold": true}, {"text": "NOS VENÍA ARREANDO EL DIOS DE LA PAZ.", "bold": true}]}, {"number": "063", "title": "Mi camino", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Quisiera escuchar tus pasos", "bold": false}, {"text": "en esta noche que aún no termina.", "bold": false}, {"text": "Quisiera descubrirte en medio de este invierno.", "bold": false}, {"text": "Quisiera sentir tu calor, yo sin ti muero.", "bold": false}, {"text": "", "bold": false}, {"text": "Y te apareces anunciando la aurora,", "bold": false}, {"text": "y nos sorprendes una vez más con tu aroma,", "bold": false}, {"text": "y nos regalas tu melodía de esperanza,", "bold": false}, {"text": "que renueva el alma...", "bold": false}, {"text": "", "bold": false}, {"text": "Quisiera encontrarte, oasis,", "bold": false}, {"text": "en medio de este desierto.", "bold": false}, {"text": "Quisiera recordar que eres palabra en mi silencio", "bold": false}, {"text": "Y te apareces anunciando la aurora,", "bold": false}, {"text": "y nos sorprendes una vez más con tu aroma,", "bold": false}, {"text": "y nos regalas tu melodía de esperanza,", "bold": false}, {"text": "que renueva el alma...", "bold": false}, {"text": "", "bold": false}, {"text": "Eres mi luz, eres mi paz,", "bold": false}, {"text": "eres mi sol,", "bold": false}, {"text": "mi camino, mi verdad,", "bold": false}, {"text": "mi vida y mi amor. (x2)", "bold": false}]}, {"number": "064", "title": "Mi Getsemaní", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Para que mi amor no sea un sentimiento", "bold": false}, {"text": "tan sólo de deslumbramiento pasajero;", "bold": false}, {"text": "para no gastar mis palabras más mías", "bold": false}, {"text": "ni vaciar de contenido mi \"te quiero\".", "bold": false}, {"text": "", "bold": false}, {"text": "Quiero hundir más hondo mi raíz en ti", "bold": false}, {"text": "y cimentar en solidez éste, mi afecto;", "bold": false}, {"text": "pues mi corazón, que es inquieto y es frágil,", "bold": false}, {"text": "sólo acierta, si se abraza a tu proyecto.", "bold": false}, {"text": "", "bold": false}, {"text": "MÁS ALLÁ DE MIS MIEDOS,", "bold": true}, {"text": "MÁS ALLÁ DE MI INSEGURIDAD,", "bold": true}, {"text": "QUIERO DARTE MI RESPUESTA:", "bold": true}, {"text": "AQUÍ ESTOY, PARA HACER TU VOLUNTAD,", "bold": true}, {"text": "PARA QUE MI AMOR SEA DECIRTE SÍ,", "bold": true}, {"text": "HASTA EL FINAL.", "bold": true}, {"text": "", "bold": false}, {"text": "Duermen su sopor y temen en el huerto:", "bold": false}, {"text": "ni sus amigos acompañan al Maestro.", "bold": false}, {"text": "Si es hora de cruz, es de fidelidades;", "bold": false}, {"text": "pero el mundo nunca quiere aceptar esto.", "bold": false}, {"text": "", "bold": false}, {"text": "Dame comprender, Señor, tu amor tan puro:", "bold": false}, {"text": "amor que persevera en cruz, amor perfecto.", "bold": false}, {"text": "Dame serte fiel cuando todo es oscuro,", "bold": false}, {"text": "para que mi amor sea más que un sentimiento.", "bold": false}, {"text": "", "bold": false}, {"text": "No es en las palabras ni es en las promesas", "bold": false}, {"text": "donde la historia tiene su motor secreto:", "bold": false}, {"text": "sólo es el amor en la cruz madurado,", "bold": false}, {"text": "el amor que mueve todo el universo.", "bold": false}, {"text": "", "bold": false}, {"text": "Pongo mi pequeña vida hoy en tus manos,", "bold": false}, {"text": "por sobre mis inseguridades y mis miedos;", "bold": false}, {"text": "y, para elegir tu querer y no el mío,", "bold": false}, {"text": "hazme, en mi Getsemaní, fiel y despierto.", "bold": false}]}, {"number": "065", "title": "Nada te turbe", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Nada te turbe, que nada te espante.", "bold": false}, {"text": "Que todo se pasa, que el odio no queda.", "bold": false}, {"text": "", "bold": false}, {"text": "Y la paciencia, que todo lo alcanza.", "bold": false}, {"text": "Y quien a Dios tiene ya nada le falta.", "bold": false}, {"text": "", "bold": false}, {"text": "Sólo Dios alcanza, sí, sólo Dios, (sólo Dios).", "bold": false}, {"text": "Estamos hechos para Dios, para Dios, (para Dios)", "bold": false}, {"text": "Sólo Dios llena el vacío interior, (Interior).", "bold": false}, {"text": "Estamos hechos para Dios, para Dios, para Dios.", "bold": false}]}, {"number": "066", "title": "Oración simple", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Señor haz de mí,", "bold": false}, {"text": "un instrumento de tu paz.", "bold": false}, {"text": "", "bold": false}, {"text": "Donde haya odio, ponga yo amor.", "bold": false}, {"text": "Donde haya ofensa, ponga yo perdón.", "bold": false}, {"text": "Donde haya discordia, lleva la unidad.", "bold": false}, {"text": "", "bold": false}, {"text": "Donde haya error, lleve la verdad.", "bold": false}, {"text": "Donde haya miedo, ponga la esperanza.", "bold": false}, {"text": "Donde haya dudas, lleve yo mi fe.", "bold": false}, {"text": "", "bold": false}, {"text": "Donde haya tristezas, lleve mi alegría.", "bold": false}, {"text": "Donde haya tinieblas, ponga yo tu luz.", "bold": false}, {"text": "Donde haya odio, ponga yo tu amor.", "bold": false}]}, {"number": "067", "title": "Que mi vida entera", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Que mi vida entera sea una canción de amor", "bold": false}, {"text": "para Ti.", "bold": false}, {"text": "Que mi vida entera cante para Ti", "bold": false}, {"text": "que las cosas que vivo y las cosas que pienso", "bold": false}, {"text": "sean incienso para Ti,", "bold": false}, {"text": "que mi vida entera cante para Ti.", "bold": false}, {"text": "", "bold": false}, {"text": "Que mi vida entera sea una canción de amor", "bold": false}, {"text": "para Ti.", "bold": false}, {"text": "Que mi vida entera cante para Ti,", "bold": false}, {"text": "que las cosas que vivo y las cosas que pienso", "bold": false}, {"text": "sean incienso para Ti,", "bold": false}, {"text": "que mi vida entera cante para Ti.", "bold": false}, {"text": "", "bold": false}, {"text": "Que mi vida entera sea una canción de amor", "bold": false}, {"text": "para Ti.", "bold": false}, {"text": "Que mi vida entera cante para Ti,", "bold": false}, {"text": "que las cosas que vivo y las cosas que pienso", "bold": false}, {"text": "sean incienso para Ti,", "bold": false}, {"text": "que mi vida entera cante para Ti.", "bold": false}]}, {"number": "068", "title": "Signos de amor", "lines": [{"text": "ENTRADA", "bold": false}]}, {"number": "069", "title": "Solo el amor", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Debes amar la arcilla que va en tus manos", "bold": false}, {"text": "debes amar su arena hasta la locura", "bold": false}, {"text": "y si no, no la emprendas que será en vano", "bold": false}, {"text": "sólo el amor alumbra lo que perdura", "bold": false}, {"text": "sólo el amor convierte en milagro el barro", "bold": false}, {"text": "", "bold": false}, {"text": "Debes amar el tiempo de los intentos", "bold": false}, {"text": "debes amar la hora que nunca brilla", "bold": false}, {"text": "y si no, no pretendas tocar los yertos", "bold": false}, {"text": "sólo el amor engendra la maravilla", "bold": false}, {"text": "sólo el amor consigue encender lo muerto", "bold": false}]}, {"number": "070", "title": "Tan pobre y tan rico", "lines": [{"text": "ENTRADA", "bold": false}]}, {"number": "071", "title": "Te transformaré", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Miras, no entiendes nada", "bold": false}, {"text": "sientes que te traspasa", "bold": false}, {"text": "ven amigo y entrégamelo a mí", "bold": false}, {"text": "que te transformaré", "bold": false}, {"text": "", "bold": false}, {"text": "Sientes que es muy lejano", "bold": false}, {"text": "tratas de encontrarlo", "bold": false}, {"text": "ven amigo y ofrécemelo a mí", "bold": false}, {"text": "que te transformaré", "bold": false}, {"text": "", "bold": false}, {"text": "CONFÍA EN MÍ, RECIBE DE MÍ", "bold": true}, {"text": "TIENES QUE VIVIR LA VIDA", "bold": true}, {"text": "TRANSFORMANDO AL MUNDO ENTERO", "bold": true}, {"text": "PERO DEJA QUE TE TRANSFORME YO A TI", "bold": true}, {"text": "", "bold": false}, {"text": "Cuentas que estás perdido", "bold": false}, {"text": "oyes tan sólo gritos", "bold": false}, {"text": "ven amigo y pelea por mí", "bold": false}, {"text": "que te transformaré", "bold": false}, {"text": "", "bold": false}, {"text": "Guardas todo contigo", "bold": false}, {"text": "vamos a compartirlo", "bold": false}, {"text": "ven amigo y dámelo a mí", "bold": false}, {"text": "que te transformaré", "bold": false}]}, {"number": "072", "title": "Torrente de Vida", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Torrentes de vida haz brotar en mí,", "bold": false}, {"text": "mi tierra sedienta suspira por ti.", "bold": false}, {"text": "Nada puedo Señor sin tu gracia.", "bold": false}, {"text": "Todo lo puedo con Cristo mi Rey.", "bold": false}, {"text": "", "bold": false}, {"text": "MUEVE MI CORAZÓN", "bold": true}, {"text": "PARA QUE TE RECIBA SIEMPRE,", "bold": true}, {"text": "ABRE MIS OJOS PARA QUE PUEDA VERTE,", "bold": true}, {"text": "MIS OÍDOS QUE PUEDAN ESCUCHARTE.", "bold": true}, {"text": "MI VIDA SEA PALABRA QUE HABLE DE TI.", "bold": true}]}, {"number": "073", "title": "Tu estas aquí", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "Aunque mis ojos, no te puedan ver,", "bold": false}, {"text": "Te puedo sentir, sé que estás aquí.", "bold": false}, {"text": "Aunque mis manos", "bold": false}, {"text": "No puedan tocar, tu rostro señor,", "bold": false}, {"text": "Sé que estás aquí,", "bold": false}, {"text": "", "bold": false}, {"text": "Mi corazón, puede sentir tu presencia,", "bold": false}, {"text": "Tú estás aquí, tú estás aquí", "bold": false}, {"text": "Puedo sentir, tu majestad", "bold": false}, {"text": "Tú estás aquí, tú estás aquí                                               sigue >", "bold": false}, {"text": "Mi corazón, puede mirar tu hermosura,", "bold": false}, {"text": "Tú estás aquí, tú estás aquí", "bold": false}, {"text": "Puedo sentir, tu gran amor", "bold": false}, {"text": "Tú estás aquí, tú estás aquí", "bold": false}, {"text": "Tú estás aquí, tú estás aquí", "bold": false}]}, {"number": "074", "title": "Tu mirada", "lines": [{"text": "ENTRADA", "bold": false}, {"text": "No tengo palabras", "bold": false}, {"text": "Que puedan formar una oración", "bold": false}, {"text": "Que me salga entera", "bold": false}, {"text": "", "bold": false}, {"text": "Bebo tu silencio", "bold": false}, {"text": "De a sorbos pequeños para llenar", "bold": false}, {"text": "Mi aljibe solitario", "bold": false}, {"text": "", "bold": false}, {"text": "PEDIRTE DONES", "bold": true}, {"text": "NO ME OCUPA LA INTENCIÓN", "bold": true}, {"text": "SINO SENTIRME ESTANDO BIEN AMADA", "bold": true}, {"text": "SOLO VOS Y YO, Y TU MIRADA", "bold": true}, {"text": "QUE TRASPASA QUE ME ACABA", "bold": true}, {"text": "SACUDIENDO EL CORAZÓN", "bold": true}, {"text": "", "bold": false}, {"text": "Como te despiertas,", "bold": false}, {"text": "Flor de primavera, en mi Jesús", "bold": false}, {"text": "Cuando a vos me dispongo", "bold": false}, {"text": "", "bold": false}, {"text": "Que suave es tu aliento,", "bold": false}, {"text": "Mi respiración del corazón", "bold": false}, {"text": "Rezando en tus manos", "bold": false}, {"text": "", "bold": false}, {"text": "Y SIENTO QUE", "bold": true}, {"text": "EN ESTO DE L
